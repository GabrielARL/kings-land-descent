<style>
/* Layout: one screen of a storybook lesson; the night map (the stage) on the left, the story and its formula on the
   right with one big Next; the chapters as a bar that fills along the bottom. */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #17212c;
  --muted: #546273;
  --line: #d3dbe4;
  --accent: #8f5a00;
  --accent-fill: #f5c25c;
  --accent-ink: #1b1406;
  --math-bg: #f4f6f9;
  --stage: #0b121b;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px;
}
.course { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.course-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.course-head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; text-wrap: balance; }
.count { font-family: var(--mono); font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-body { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.stage { position: relative; aspect-ratio: 16 / 11; max-width: 100%; background: var(--stage); border-radius: 12px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.story { box-sizing: border-box; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chapter { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.story h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.text { max-width: 65ch; }
.text kbd { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.math { font-family: var(--mono); font-size: 14px; line-height: 1.75; background: var(--math-bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; overflow-wrap: anywhere; }
.bp { opacity: 0.15; transition: opacity 0.3s; }
.bp.on { opacity: 1; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls button { font: inherit; font-size: 15px; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.controls button:hover { border-color: var(--accent); }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls #board-next { margin-left: auto; background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); font-weight: 700; padding: 10px 26px; font-size: 17px; }
.controls #board-next:disabled { opacity: 0.55; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.contents summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.contents ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; font-size: 14px; border-top: 1px solid var(--line); }
.contents .bl-chap { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 4px 2px; }
.contents .bl-step { display: flex; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.contents .bl-step span { min-width: 1.8em; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.contents .bl-step:hover { background: var(--math-bg); }
.contents .bl-step.on { background: var(--math-bg); font-weight: 700; }
.progress { display: flex; gap: 4px; }
.progress .seg { position: relative; flex-basis: 0; min-width: 0; height: 36px; border: 0; border-radius: 6px; background: var(--line); cursor: pointer; overflow: hidden; padding: 0 8px; text-align: left; color: var(--ink); font: inherit; }
.progress .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-fill); opacity: 0.55; transition: width 0.3s; }
.progress .seg.on .fill { opacity: 0.9; }
.progress .name { position: relative; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.progress .seg.on .name { font-weight: 700; }
@media (max-width: 820px) {
  .course-body { grid-template-columns: minmax(0, 1fr); }
  .stage { aspect-ratio: 4 / 5; }
  .story h2 { font-size: 23px; }
  .progress .name { display: none; }
  .progress .seg { height: 12px; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { .bp, .progress .fill { transition: none; } }

<body>
<main class="course" id="board">
  <header class="course-head">
    <div>
      <div class="eyebrow">A tale of three optimisers</div>
      <h1 id="board-title">Three heroes downhill</h1>
    </div>
    <span class="count" id="board-count"></span>
  </header>
  <div class="course-body">
    <div class="stage"><canvas id="board-canvas" aria-label="The animation of this step"></canvas></div>
    <section class="story" aria-live="polite">
      <div class="chapter" id="board-chapter"></div>

      <div class="text" id="board-text"></div>

      <div class="controls">
        <button type="button" id="board-prev">← Back</button>
        <button type="button" id="board-replay" title="Play this step’s animation again">↻ Replay</button>
        <button type="button" id="board-play" aria-pressed="false">⏵ Play</button>
        <button type="button" id="board-next">Next →</button>

    </section>
  </div>
  <nav class="progress" id="progress" aria-label="Chapters"></nav>

<script>
// The three heroes' walks on a land of two coordinates, for kings_land_descent.html, the companion page of deck
// lbgfs_admm_diff_no_math (Three heroes downhill).  Plain JavaScript without optional chaining, so that Node 12
// runs test_engine.js on it.
// A land gives J (the walkers' land) and its gradient, f (the Twins' land, J without a law hill), the Wanderer's
// step argmin f + rho/2 |x - v|^2, the Warden's projection onto the law, and the box the walkers keep to (null on
// the open plane).  Weather adds ripples to the heights and haze to every tap of the ground.
var Engine = (function () {
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function add(a, b, s) { return [a[0] + s * b[0], a[1] + s * b[1]]; }
  function norm(a) { return Math.sqrt(dot(a, a)); }
  function clip(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function clipBox(x, box) { return box ? [clip(x[0], box[0], box[1]), clip(x[1], box[0], box[1])] : x.slice(); }
  function finite(x) { return isFinite(x[0]) && isFinite(x[1]) && Math.abs(x[0]) < 1e6 && Math.abs(x[1]) < 1e6; }

  // A seeded stream of numbers (mulberry32) with normal draws (Box-Muller): a hazy walk is the same every time.
  function stream(seed) {
    var a = (seed >>> 0) || 1;
    function u() {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return { u: u, normal: function () { return Math.sqrt(-2 * Math.log(1 - u())) * Math.cos(2 * Math.PI * u()); } };
  }

  // ---------------------------------------------------------------- the quadratic lands (canyon, wall, misty hills)
  function quadLand(p) {
    var th = p.theta * Math.PI / 180, co = Math.cos(th), si = Math.sin(th);
    var a11 = p.l1 * co * co + p.l2 * si * si, a22 = p.l1 * si * si + p.l2 * co * co, a12 = (p.l1 - p.l2) * co * si;
    var c = [p.c1, p.c2], box = p.box || null;
    function J(x) { var d0 = x[0] - c[0], d1 = x[1] - c[1]; return 0.5 * (d0 * (a11 * d0 + a12 * d1) + d1 * (a12 * d0 + a22 * d1)); }
    function grad(x) { var d0 = x[0] - c[0], d1 = x[1] - c[1]; return [a11 * d0 + a12 * d1, a12 * d0 + a22 * d1]; }
    function wanderer(v, rho) {      // (A + rho I) x = A c + rho v
      var b0 = a11 * c[0] + a12 * c[1] + rho * v[0], b1 = a12 * c[0] + a22 * c[1] + rho * v[1];
      var m11 = a11 + rho, m22 = a22 + rho, det = m11 * m22 - a12 * a12;
      return [(m22 * b0 - a12 * b1) / det, (m11 * b1 - a12 * b0) / det];
    }
    function project(w) { return clipBox(w, box); }
    // The treasure: c, or the lowest point of the box (on an edge when c is outside).
    function treasure() {
      if (!box || (c[0] >= box[0] && c[0] <= box[1] && c[1] >= box[0] && c[1] <= box[1])) return c.slice();
      var best = null;
      [[0, box[0]], [0, box[1]], [1, box[0]], [1, box[1]]].forEach(function (e) {
        var k = e[0], fixed = e[1], free = 1 - k;          // coordinate k held at fixed, the other free
        var aff = k === 0 ? a22 : a11;
        var t = c[free] - a12 * (fixed - c[k]) / aff;       // dJ/dfree = 0
        var x = [0, 0]; x[k] = fixed; x[free] = clip(t, box[0], box[1]);
        if (!best || J(x) < J(best)) best = x;
      });
      return best;
    }
    return { kind: 'quad', J: J, f: J, grad: grad, fgrad: grad, wanderer: wanderer, project: project, box: box, wanderBox: null,
             lawBox: box, A: [[a11, a12], [a12, a22]], c: c, treasure: treasure() };
  }

  // ---------------------------------------------------------------- the tower lands (fort, ridge)
  // Cards x in [-1, 1]; the lanterns y; CORAL's three terms with one tower over the two sentries.
  // s = +1: the tower's law is that the two flags agree (x1 x2 = +1); s = -1: that they differ.
  function towerLand(p) {
    var y = [p.y1, p.y2], s2 = p.s2, muP = p.muP, muB = p.muB, s = p.law;
    function f(x) {
      var v = 0;
      for (var i = 0; i < 2; i++) v += (y[i] - x[i]) * (y[i] - x[i]) / (2 * s2) + muB * Math.pow(1 - x[i] * x[i], 2);
      return v;
    }
    function J(x) { var r = 1 - s * x[0] * x[1]; return f(x) + muP * r * r; }
    function fgrad(x) { return [0, 1].map(function (i) { return (x[i] - y[i]) / s2 - 4 * muB * x[i] * (1 - x[i] * x[i]); }); }
    function grad(x) {
      var r = 1 - s * x[0] * x[1], g = fgrad(x);
      return [g[0] - 2 * muP * r * s * x[1], g[1] - 2 * muP * r * s * x[0]];
    }
    // One sentry's best card on [-1, 1]: phi(x) = (y-x)^2/(2 s2) + muB (1-x^2)^2 + rho/2 (x - v)^2,
    // phi'(x) = 4 muB x^3 + (1/s2 - 4 muB + rho) x - (y/s2 + rho v): the real roots of a depressed cubic and both ends.
    function phi(x, yi, v, rho) { return (yi - x) * (yi - x) / (2 * s2) + muB * Math.pow(1 - x * x, 2) + rho / 2 * (x - v) * (x - v); }
    function bestCard(yi, v, rho) {
      var a = 4 * muB, b = 1 / s2 - 4 * muB + rho, c0 = -(yi / s2 + rho * v);
      var cands = [-1, 1], roots = [];
      if (a < 1e-14) { roots.push(-c0 / b); }
      else {
        var P = b / a, Q = c0 / a, disc = Q * Q / 4 + P * P * P / 27;
        if (Math.abs(P) < 1e-12) roots.push(Math.cbrt(-Q));
        else if (disc > 0) { var sq = Math.sqrt(disc); roots.push(Math.cbrt(-Q / 2 + sq) + Math.cbrt(-Q / 2 - sq)); }
        else {
          var r = Math.sqrt(-P / 3), ang = Math.acos(clip(3 * Q / (2 * P) * Math.sqrt(-3 / P), -1, 1)) / 3;
          for (var k = 0; k < 3; k++) roots.push(2 * r * Math.cos(ang - 2 * Math.PI * k / 3));
        }
      }
      roots.forEach(function (t) { if (t > -1 && t < 1) cands.push(t); });
      var best = cands[0];
      cands.forEach(function (t) { if (phi(t, yi, v, rho) < phi(best, yi, v, rho)) best = t; });
      return best;
    }
    function wanderer(v, rho) { return [bestCard(y[0], v[0], rho), bestCard(y[1], v[1], rho)]; }
    // The law's set: the segment between the two lawful corners (the tower's parity polytope).
    var lawA = s > 0 ? [1, 1] : [1, -1], lawB = s > 0 ? [-1, -1] : [-1, 1];
    function project(w) {
      var d = [lawB[0] - lawA[0], lawB[1] - lawA[1]];
      var t = clip(dot([w[0] - lawA[0], w[1] - lawA[1]], d) / dot(d, d), 0, 1);
      return [lawA[0] + t * d[0], lawA[1] + t * d[1]];
    }
    // The King's true order: the lawful corner the lanterns favour.
    var lantern = function (q) { return (y[0] - q[0]) * (y[0] - q[0]) + (y[1] - q[1]) * (y[1] - q[1]); };
    var truth = lantern(lawA) <= lantern(lawB) ? lawA : lawB;
    return { kind: 'tower', J: J, f: f, grad: grad, fgrad: fgrad, wanderer: wanderer, project: project, box: [-1, 1], wanderBox: [-1, 1],
             lawSegment: [lawA, lawB], lawSign: s, y: y, treasure: truth.slice(), bestCard: bestCard };
  }

  // ---------------------------------------------------------------- weather
  // Ripples: R(x) = A/sqrt(6) sum_k sin(w_k . x + phi_k), six waves of random heading, a length within 25% of L
  // and a random phase.
  function ripples(A, L, seed) {
    var r = stream(seed * 7919 + 17), waves = [];
    for (var k = 0; k < 6; k++) {
      var th = 2 * Math.PI * r.u(), len = L * (0.75 + 0.5 * r.u()), w = 2 * Math.PI / len;
      waves.push({ w: [w * Math.cos(th), w * Math.sin(th)], phi: 2 * Math.PI * r.u(), len: len });
    }
    var a = A / Math.sqrt(6);
    return {
      A: A, L: L, amp: a, waves: waves,
      R: function (x) { var s = 0; for (var k = 0; k < 6; k++) s += Math.sin(dot(waves[k].w, x) + waves[k].phi); return a * s; },
      grad: function (x) {
        var g0 = 0, g1 = 0;
        for (var k = 0; k < 6; k++) { var c = Math.cos(dot(waves[k].w, x) + waves[k].phi); g0 += c * waves[k].w[0]; g1 += c * waves[k].w[1]; }
        return [a * g0, a * g1];
      }
    };
  }
  // Black holes: B(x) = -sum_j D exp(-|x - p_j|^2 / (2 w^2)), narrow deep wells at seeded places inside the realm,
  // kept off the start flag and apart from each other.
  function holes(n, D, w, seed, region, avoid) {
    var r = stream(seed * 104729 + 7), at = [], tries = 0;
    var x0 = region[0] + 0.06 * (region[1] - region[0]), x1 = region[1] - 0.06 * (region[1] - region[0]);
    var y0 = region[2] + 0.06 * (region[3] - region[2]), y1 = region[3] - 0.06 * (region[3] - region[2]);
    while (at.length < n && tries < 500) {
      tries++;
      var q = [x0 + (x1 - x0) * r.u(), y0 + (y1 - y0) * r.u()];
      if (avoid && norm([q[0] - avoid[0], q[1] - avoid[1]]) < 6 * w) continue;
      if (at.some(function (p) { return norm([p[0] - q[0], p[1] - q[1]]) < 8 * w; })) continue;
      at.push(q);
    }
    var k2 = 1 / (2 * w * w);
    return {
      n: at.length, D: D, w: w, at: at,
      B: function (x) { var v = 0; for (var j = 0; j < at.length; j++) { var dx = x[0] - at[j][0], dy = x[1] - at[j][1]; v -= D * Math.exp(-(dx * dx + dy * dy) * k2); } return v; },
      grad: function (x) {
        var g0 = 0, g1 = 0;
        for (var j = 0; j < at.length; j++) { var dx = x[0] - at[j][0], dy = x[1] - at[j][1], e = D * Math.exp(-(dx * dx + dy * dy) * k2) / (w * w); g0 += e * dx; g1 += e * dy; }
        return [g0, g1];
      },
      // how much of x lies inside a hole, 0 to 1, for drawing them black
      depth: function (x) { var m = 0; for (var j = 0; j < at.length; j++) { var dx = x[0] - at[j][0], dy = x[1] - at[j][1]; m = Math.max(m, Math.exp(-(dx * dx + dy * dy) * k2)); } return m; }
    };
  }
  // Where the heroes may stand: the cards' box on the tower lands, the map elsewhere.
  function realm(land) { return land.kind === 'tower' ? [-1, 1, -1, 1] : land.view; }
  function scan(fn, region, n) {
    var lo = Infinity, hi = -Infinity, at = null;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var x = [region[0] + (region[1] - region[0]) * i / (n - 1), region[2] + (region[3] - region[2]) * j / (n - 1)], z = fn(x);
      if (z < lo) { lo = z; at = x; }
      if (z > hi) hi = z;
    }
    return { lo: lo, hi: hi, at: at };
  }
  // The lowest spot of J where the walkers may stand: a grid, then projected steps downhill.
  function lowestSpot(land) {
    var region = land.box ? [land.box[0], land.box[1], land.box[0], land.box[1]] : land.view, width = region[1] - region[0];
    var shortest = Math.min(land.ripples ? 0.75 * land.ripples.L : width, land.holes ? 2 * land.holes.w : width), n = Math.max(161, Math.min(601, Math.ceil(12 * width / shortest)));
    var pts = [];
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var x = [region[0] + width * i / (n - 1), region[2] + (region[3] - region[2]) * j / (n - 1)];
      pts.push([land.J(x), x]);
    }
    pts.sort(function (a, b) { return a[0] - b[0]; });
    var best = null, seeds = land.holes ? land.holes.at.map(function (p) { return p.slice(); }) : [];
    for (var k = 0; k < pts.length && seeds.length < 8 + (land.holes ? land.holes.n : 0); k++) {
      if (seeds.every(function (s0) { return norm([s0[0] - pts[k][1][0], s0[1] - pts[k][1][1]]) > 0.5 * shortest; })) seeds.push(pts[k][1]);
    }
    seeds.forEach(function (q) {
      var Jq = land.J(q), t = 0.01 * land.span;
      for (var it = 0; it < 4000 && t > 1e-14; it++) {
        var g = land.grad(q), gn = norm(g); if (gn < 1e-13) break;
        var nq = clipBox(add(q, g, -t / gn), land.box), Jn = land.J(nq);
        if (Jn < Jq) { q = nq; Jq = Jn; t *= 1.2; } else t *= 0.5;
      }
      if (!best || Jq < best[0]) best = [Jq, q];
    });
    return best[1];
  }
  // Weather on a land.  A and the haze sigma are shares of the land's height range where the heroes may stand; the
  // ripple length L and the staff h are shares of the map's width.  The walkers feel the slope with four taps of
  // the staff; in haze each tap is the height plus N(0, sigma^2), and the slope they use is what the taps say.
  function withWeather(base, view, p) {
    var land = {}, k;
    for (k in base) land[k] = base[k];
    land.base = base; land.view = view; land.span = view[1] - view[0];
    var range = scan(base.J, realm(land), 61);
    land.heightRange = range.hi - range.lo;
    var A = (p.ripA || 0) * land.heightRange, L = (p.ripL || 0.2) * land.span;

  }

  // ------------------------------------------------------------ the two-bit parity lands

    if (!tw) { cx.parts.push({ name: 'parity penalty', value: law, col: C.violet }); cx.gradParts.push({ name: 'parity penalty', vec: gLaw, col: C.violet }); }

      });

<script>
// The tutorial "Three heroes downhill": the tale of three optimisers told as one line of steps.  The reader only
// clicks Next.  Each step is a line or two of the story, its formula with real numbers, and an animation on the map
// of the land.  The lands and the walks come from engine.js; the drawing kit, the step player and the day-by-day steps
// (feeling the slope, the Pilgrim's stride, the Cartographer's journal, the Twins' day) from board.js and
// board_parts.js.
(function () {
  'use strict';
  var E = window.Engine, B = window.Board; if (!E || !B) return;
  var H = B.H, C = H.C, seg = H.seg, num = H.num, pair = H.pair, at = H.at, add = H.add, sub = H.sub, dot = H.dot, len = H.len;
  var scale = H.scale, mix = H.mix, lerp2 = H.lerp2, around = H.around, ease = H.ease, clamp = H.clamp, TAU = 2 * Math.PI;
  var NAMES = { pg: 'the Pilgrim', lb: 'the Cartographer', tw: 'the Wanderer' }, COL = { pg: C.orange, lb: C.blue, tw: '#e6e9ee' };

  // ------------------------------------------------------------ lands and walks, as the game computes them
  function world(key, over) {
    var p = {}, k; for (k in E.PRESETS[key]) p[k] = E.PRESETS[key][k]; for (k in (over || {})) p[k] = over[k];
    var K = E.KINDS[key], land = E.buildLand(key, p), x0 = K.kind === 'tower' && p.sx == null ? E.lanternStart(p) : [p.sx, p.sy], D = Math.round(p.days);
    var W = { key: key, p: p, K: K, land: land, x0: x0, view: K.view, T: land.treasure,
              walks: { pg: E.pilgrim(land, x0, p.alpha, D), lb: E.cartographer(land, x0, Math.round(p.m), D), tw: E.twins(land, x0, p.rho, D) } };
    var v = K.view, lo = Infinity, hi = -Infinity, sm = land.smooth || land.J;
    for (var i = 0; i <= 40; i++) for (var j = 0; j <= 40; j++) { var z = sm([v[0] + (v[1] - v[0]) * i / 40, v[2] + (v[3] - v[2]) * j / 40]); lo = Math.min(lo, z); hi = Math.max(hi, z); }
    W.shade = { id: key + JSON.stringify(over || {}), lo: lo, hi: hi, pits: !!land.holes, rings: 14 };
    W.Jstar = land.J(W.T);
    return W;
  }
  function ctxOf(W, hero, day) { return { hero: hero, name: NAMES[hero], key: W.key, L: { view: W.view, kind: W.K.kind }, land: W.land, p: W.p, x0: W.x0, day: day, walk: W.walks[hero], tutorial: true }; }
  // steps of the day-by-day board, renamed into the course's chapter
  function pick(W, hero, day, ids, chapter) {
    var all = B.plan(ctxOf(W, hero, day)).steps;
    return ids.map(function (id) {
      var s = all.filter(function (q) { return q.id === id; })[0]; if (!s) throw new Error('no step ' + id);
      var c = {}, k; for (k in s) c[k] = s[k]; c.id = W.key + '-' + hero + '-' + id; c.chapter = chapter; return c;
    });
  }
  function firstWithin(walk, T, tol, key) { for (var k = 0; k < walk.length; k++) { var q = walk[k][key || 'x']; if (Math.hypot(q[0] - T[0], q[1] - T[1]) <= tol) return k; } return null; }

  // ------------------------------------------------------------ drawing helpers for the story steps
  function base(g, W, o) {
    o = o || {}; var sh = {}, k; for (k in W.shade) sh[k] = W.shade[k]; if (o.alpha != null) sh.alpha = o.alpha;
    g.land(W.land.J, sh); g.axes();
    var b = W.land.box;
    if (b && W.K.kind === 'quad' && o.law !== false) g.path([[b[0], b[0]], [b[1], b[0]], [b[1], b[1]], [b[0], b[1]], [b[0], b[0]]], C.blue, 2, o.lawP == null ? 1 : o.lawP);
    if (W.K.kind === 'tower' && o.law !== false) g.line(W.land.lawSegment[0], W.land.lawSegment[1], C.blue, 2, 1, [6, 4]);
  }
  function star(g, q, p, text) {
    if (!(p > 0)) return; var c = g.ctx, a = g.P(q), r = 11 * H.backOut(p);
    var gl = c.createRadialGradient(a[0], a[1], 0, a[0], a[1], 30); gl.addColorStop(0, 'rgba(255,210,122,0.55)'); gl.addColorStop(1, 'rgba(255,210,122,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(a[0], a[1], 30, 0, TAU); c.fill();
    c.beginPath(); for (var i = 0; i < 10; i++) { var an = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; c.lineTo(a[0] + rr * Math.cos(an), a[1] + rr * Math.sin(an)); }
    c.closePath(); c.fillStyle = '#ffd27a'; c.fill(); c.strokeStyle = '#8a4b00'; c.lineWidth = 1.2; c.stroke();
    if (text) g.label(q, text, C.gold, { dx: 16, dy: 14, p: seg(p, 0.4, 1), size: 12.5 });
  }
  // a walk drawn up to a fractional day; returns where its hero stands then
  function walkTo(g, walk, upto, col, w, key) {
    key = key || 'x'; var n = Math.min(walk.length - 1, Math.floor(upto)), f = clamp(upto - n, 0, 1), pts = [];

  out.push({ id: 'light-rounds', chapter: CH.cajode, title: 'Run all checks together', layout: 'side', dur: 8,
    text: 'Each round updates all nine shared values, projects all six check replicas from that same shared state, then updates all 18 edge duals. In this computed fixed-evidence run, the hard board passes every row and column at round 3, while the primal and dual residuals are still nonzero. The continuous state settles only at round 8. A zero syndrome is therefore not the same event as ADMM convergence.',
    math: 'round 3: syndrome = 0 but r = ' + num(LIGHT_TRACE[3].primal, 4) + ', s = ' + num(LIGHT_TRACE[3].dual, 4) + ';  round 8: r = s = 0',

    } });

  out.push({ id: 'light-ldpc', chapter: CH.cajode, title: 'From the light board to an LDPC graph', layout: 'side', dur: 6,
    text: 'Redraw each lamp as a shared variable node and each row or column test as a check node; draw an edge whenever that check uses that bit. The light board is a small regular product code. An LDPC code uses a much larger sparse graph, usually with different connections and check sizes. The same ADMM bookkeeping remains: shared bits b, per-check replica vectors z, and one scaled dual u on every check-bit edge.',
    math: 'light board incidence graph → sparse LDPC graph;  same b / z / u roles, different code',
    draw: function (g, p) {
      var R = g.sideR, c = g.ctx, narrow = R[2] < 580, BR = narrow ? [R[0] + 4, R[1] + 28, R[2] - 8, R[3] * 0.48] : [R[0] + 4, R[1] + 28, R[2] * 0.47, R[3] - 34];
      var GR = narrow ? [R[0] + 8, R[1] + R[3] * 0.53, R[2] - 16, R[3] * 0.44] : [R[0] + R[2] * 0.50, R[1] + 34, R[2] * 0.48, R[3] - 42];
      g.panel(R, 'The wiring is the code'); lightBoard(g, BR, LIGHT_VALID, { panel: false, p: seg(p, 0, 0.45) });
      var bits = [], checks = [], bx0 = GR[0] + GR[2] * 0.19, by0 = GR[1] + GR[3] * 0.29, dx = GR[2] * 0.21, dy = GR[3] * 0.25;
      for (var i = 0; i < 9; i++) bits.push([bx0 + (i % 3) * dx, by0 + Math.floor(i / 3) * dy]);
      for (i = 0; i < 3; i++) checks.push([bx0 + 3 * dx + GR[2] * 0.10, by0 + i * dy]);
      for (i = 0; i < 3; i++) checks.push([bx0 + i * dx, by0 - GR[3] * 0.17]);
      LIGHT_CHECKS.forEach(function (members, a) { members.forEach(function (bit, edge) { var q = seg(p, 0.25 + (a * 3 + edge) * 0.018, 0.52 + (a * 3 + edge) * 0.018); c.globalAlpha = q; c.strokeStyle = C.faint; c.lineWidth = 1.3; c.beginPath(); c.moveTo(bits[bit][0], bits[bit][1]); c.lineTo(checks[a][0], checks[a][1]); c.stroke(); c.globalAlpha = 1; }); });
      bits.forEach(function (a, i) { var q = seg(p, 0.18 + i * 0.025, 0.42 + i * 0.025); c.globalAlpha = q; c.fillStyle = 'rgba(255,210,122,0.16)'; c.strokeStyle = C.gold; c.lineWidth = 1.5; c.beginPath(); c.arc(a[0], a[1], narrow ? 10 : 12, 0, TAU); c.fill(); c.stroke(); c.globalAlpha = 1; g.labelPx(a[0], a[1], 'b' + (i + 1), C.gold, { align: 'center', plain: true, mono: true, size: narrow ? 7.5 : 8.5, p: q }); });
      checks.forEach(function (a, i) { var isRow = i < 3, n = (i % 3) + 1, q = seg(p, 0.36 + i * 0.05, 0.60 + i * 0.05); c.globalAlpha = q; c.strokeStyle = isRow ? C.blue : C.violet; c.lineWidth = 1.8; c.strokeRect(a[0] - 15, a[1] - 12, 30, 24); c.globalAlpha = 1; g.labelPx(a[0], a[1], (isRow ? 'R' : 'C') + n, isRow ? C.blue : C.violet, { align: 'center', plain: true, mono: true, size: 9, p: q }); });
      g.labelPx(GR[0] + GR[2] / 2, GR[1] + GR[3] - 9, 'circles: shared bits   squares: local checks', C.dim, { align: 'center', plain: true, size: narrow ? 9 : 10.5, p: seg(p, 0.75, 0.95) });
    } });

  // The light board fixes its channel evidence.  These final pages state exactly what full CAJODE adds, and keep
  // acceptance of a decoded word separate from convergence of its continuous optimisation variables.
  out.push({ id: 'cajode-circuit', chapter: CH.cajode, title: 'One full CAJODE circuit', layout: 'side', dur: 5.6,
    text: 'The light-board trace held its channel LLRs fixed. Full CAJODE also estimates the channel that produced the bit evidence. One circuit computes one robust weight for each received sample, updates all shared bit variables, recomputes those weights, updates the channel coefficients, projects each check’s replica vector onto its parity polytope, and then updates every scaled dual variable.',
    math: 'weights → shared bits → weights → channel → parity-polytope projections → scaled dual variables',
    draw: function (g, p) {
      var R = g.sideR, rows = ['1  one weight per received sample', '2  all shared variables bᵢ', '3  recompute those weights', '4  all channel coefficients', '5  every check projection', '6  every scaled dual variable'];
      g.panel(R, 'One circuit, in order');
      rows.forEach(function (t, i) {
        var q = seg(p, 0.08 + 0.12 * i, 0.25 + 0.12 * i), y = R[1] + 52 + i * Math.min(42, (R[3] - 80) / rows.length);
        g.labelPx(R[0] + 28, y, t, i === 3 ? C.gold : i >= 4 ? C.blue : C.ink, { plain: true, p: q, size: 14 });
        if (i < rows.length - 1) g.labelPx(R[0] + 15, y + 20, '↓', C.dim, { plain: true, p: q, size: 15 });
      });
    } });
  out.push({ id: 'cajode-done', chapter: CH.cajode, title: 'Two different meanings of “done”', layout: 'side', dur: 5.2,
    text: 'After a complete circuit, CAJODE forms a binary word. It may accept the first decoded word that satisfies every parity check and passes the CRC. Accepting that word is not proof that the continuous variables converged: the primal and dual residuals can still be nonzero, and stationarity is not established. The wall teaches the ADMM pattern; CAJODE applies it to a nonconvex optimization problem, so the wall’s standard convergence story does not transfer automatically.',
    math: 'accepted word: parity checks + CRC   ≠   continuous convergence or stationarity',
    draw: function (g, p) {
      var R = g.sideR, mid = R[0] + R[2] / 2;
      g.panel(R, 'Do not merge these tests');
      g.labelPx(R[0] + R[2] * 0.25, R[1] + 68, 'accepting a decoded word', C.blue, { align: 'center', plain: true, p: seg(p, 0.05, 0.25), size: 15 });
      g.labelPx(R[0] + R[2] * 0.25, R[1] + 112, 'all parity checks', C.ink, { align: 'center', plain: true, p: seg(p, 0.18, 0.38) });
      g.labelPx(R[0] + R[2] * 0.25, R[1] + 142, '+ CRC', C.ink, { align: 'center', plain: true, p: seg(p, 0.3, 0.5) });
      g.labelPx(mid, R[1] + 122, '≠', C.orange, { align: 'center', plain: true, p: seg(p, 0.45, 0.6), size: 28 });
      g.labelPx(R[0] + R[2] * 0.75, R[1] + 68, 'continuous checks', C.gold, { align: 'center', plain: true, p: seg(p, 0.55, 0.7), size: 15 });
      g.labelPx(R[0] + R[2] * 0.75, R[1] + 112, 'primal + dual residuals', C.ink, { align: 'center', plain: true, p: seg(p, 0.65, 0.8) });
      g.labelPx(R[0] + R[2] * 0.75, R[1] + 142, '+ stationarity', C.ink, { align: 'center', plain: true, p: seg(p, 0.75, 0.9) });
    } });

  // 8. the misty hills
  var mT = Wm.T, mw = Wm.walks, holes = Wm.land.holes, Dm = Math.min(40, Math.max(mw.pg.length, mw.lb.length, mw.tw.length) - 1);
  out.push({ id: 'misty', chapter: CH.misty, title: 'The misty hills', layout: 'map', view: Wm.view, dur: 4.6,
    text: 'The hardest land. Six random waves ripple it, a haze makes every tap of the staff a little wrong, and three black holes, narrow and deep, hide in it. The treasure lies at the bottom of the deepest hole.',
    math: 'J(x) = valley + ripples R(x) + black holes B(x), and every tap is off by about σ = ' + num(Wm.land.sigma, 4),
    draw: function (g, p) {
      base(g, Wm, { alpha: seg(p, 0, 0.5) });
      holes.at.forEach(function (q, k) { g.halo(q, Math.max(6, 2 * holes.w * g.s), C.red, seg(p, 0.4 + 0.1 * k, 0.55 + 0.1 * k), 2); });
      star(g, mT, seg(p, 0.75, 0.95), 'the treasure, in the deepest hole'); g.flag(Wm.x0, seg(p, 0.6, 0.75));
    } });
  out.push({ id: 'mistywalks', chapter: CH.misty, title: 'Nobody finds the treasure', layout: 'map', view: Wm.view, dur: 6.4,
    text: 'The Cartographer’s long strides drop it into one of the holes, where the haze makes every stride look too high: it stalls on day ' + (mw.lb.length - 1) + '. The Pilgrim and the Twins settle in the valley’s lowest hollow and never meet a hole. No hero finds the treasure: from local measurements, a narrow pit is found only by stepping into it.',
    math: 'the Cartographer stops on day ' + (mw.lb.length - 1) + ';  nobody reaches ' + pair(mT, 2),
    draw: function (g, p) {
      base(g, Wm); holes.at.forEach(function (q) { g.halo(q, Math.max(6, 2 * holes.w * g.s), C.red, 1, 1.5); }); star(g, mT, 1);
      var up = seg(p, 0, 0.95) * Dm, a = walkTo(g, mw.pg, up, C.orange, 2), b = walkTo(g, mw.lb, Math.min(up, mw.lb.length - 1), C.blue, 2.5), x = walkTo(g, mw.tw, up, '#e6e9ee', 2);
      g.hero(a, 'pg', 1); g.hero(b, 'lb', 1, up >= mw.lb.length - 1 ? 'stalled' : ''); g.hero(x, 'tw', 1);
      g.labelPx(g.mapR[0] + 12, g.mapR[1] + 30, 'day ' + Math.floor(up), C.gold, { size: 14 });
    } });

  // 9. what we learned
  var cards = [
    ['pg', 'The Pilgrim · gradient descent', 'Needs only the slope. Simple and sure on a gentle land, slow in a narrow valley, and flung away when its stride is too long.'],
    ['lb', 'The Cartographer · L-BFGS', 'Keeps m pages of memory, learns the land’s shape and tests each stride. Fastest on this smooth canyon; haze can stall it.'],
    ['tw', 'The Twins · ADMM', 'The Wanderer hunts the lowest spot, the Warden keeps the law; a rope ties them, and the Warden’s book of their gaps makes them meet. Stop when they stand together and have stopped moving.']];
  out.push({ id: 'summary', chapter: CH.end, title: 'Three ways down', layout: 'side', dur: 5,
    text: cards.map(function (cd) { return '<b>' + cd[1] + '.</b> ' + cd[2]; }).join('<br><br>'),
    math: 'canyon: Pilgrim ' + pgDays + ' days, Cartographer ' + lbDays + ';  wall: Cartographer ' + dLb + ', Twins ' + dTw + ', Pilgrim ' + dPg,
    draw: function (g, p) {
      var R = g.sideR, stacked = g.W < g.H, gap = 8;
      var wd = stacked ? R[2] : (R[2] - 2 * gap) / 3, ht = stacked ? (R[3] - 2 * gap) / 3 : R[3];
      cards.forEach(function (cd, i) {
        var q = seg(p, 0.1 + 0.25 * i, 0.4 + 0.25 * i); if (!(q > 0)) return;
        var Rr = stacked ? [R[0], R[1] + i * (ht + gap), wd, ht] : [R[0] + i * (wd + gap), R[1], wd, ht];
        var keep = g.mapR; g.mapR = [Rr[0] + 4, Rr[1] + 34, Rr[2] - 8, Rr[3] - 40];
        var W = i === 2 ? Ww : Wc, v = i === 2 ? [0.0, 1.6, -0.1, 1.5] : [-0.1, 1.0, -0.15, 0.95];
        g.panel(Rr, cd[1]); g.view(v); g.ctx.globalAlpha = q; g.land(W.land.J, { id: W.shade.id + 'mini' + i, lo: W.shade.lo, hi: W.shade.hi, rings: 10, cell: 5 });
        if (W.land.box) g.path([[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]], C.blue, 1.5, 1);
        g.ctx.globalAlpha = 1; star(g, W.T, q);
        var w = W.walks[cd[0]], key = cd[0] === 'tw' ? 'z' : 'x', n = Math.min(w.length - 1, 30);
        var qq = walkTo(g, w, q * n, COL[cd[0]], 2, key); g.hero(qq, cd[0], q);
        g.mapR = keep;
      });
    } });
  out.push({ id: 'end', chapter: CH.end, title: 'The end of the tale', layout: 'map', view: Wc.view, dur: 6,
    text: 'That is the tale of three heroes downhill: three ways to find the lowest spot of a land you cannot see. The Pilgrim follows the slope, the Cartographer learns the shape of the land, and the Twins share the work when the King adds a law. Use Back, or the contents, to visit any step again.',
    math: '',
    draw: function (g, p) {
      base(g, Wc); star(g, T, 1); var up = seg(p, 0, 0.95) * 24;
      var a = walkTo(g, wp, up, C.orange, 2), b = walkTo(g, wc2, up, C.blue, 2.5), x = walkTo(g, Wc.walks.tw, up, '#e6e9ee', 2);
      g.hero(a, 'pg', 1); g.hero(b, 'lb', 1); g.hero(x, 'tw', 1);
    } });

  // ------------------------------------------------------------ the page: the player, the chapter bar
  var chapters = [];
  out.forEach(function (s, i) { if (!chapters.length || chapters[chapters.length - 1].name !== s.chapter) chapters.push({ name: s.chapter, start: i, n: 0 }); chapters[chapters.length - 1].n++; });
  var bar = document.getElementById('progress');
  if (bar) {
    bar.innerHTML = chapters.map(function (ch, k) { return '<button type="button" class="seg" data-k="' + k + '" style="flex-grow:' + ch.n + '" title="' + ch.name + '"><span class="fill"></span><span class="name">' + ch.name + '</span></button>'; }).join('');
    bar.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-k]') : null; if (b) B.go(chapters[+b.getAttribute('data-k')].start); });
  }
  B.onStep(function (i) {
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('[data-k]'), function (b, k) {
      var ch = chapters[k], f = clamp((i - ch.start + 1) / ch.n, 0, 1); b.querySelector('.fill').style.width = Math.round(f * 100) + '%'; b.classList.toggle('on', i >= ch.start && i < ch.start + ch.n);
    });
  });
  document.addEventListener('keydown', function (e) { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName) && (e.key === ' ' || e.key === 'Enter')) return; B.key(e); });
  B.openSteps(out, { embedded: true });
  window.course = { steps: out, chapters: chapters };
  // #step=ID&p=0.5 opens a step at a moment of its animation, with time stopped (for screenshots and checks)
  var hash = (window.location && window.location.hash) || '', ms = /step=([^&]+)/.exec(hash), mp = /p=([0-9.]+)/.exec(hash);
  if (ms) { var st = decodeURIComponent(ms[1]); B.debug({ step: /^\d+$/.test(st) ? +st : st, p: mp ? +mp[1] : 1 }); }
})();
</script>
</body>
</html>
