<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The tutorial page "The Coach and the Physio"; build_plan.py inlines its scripts and adds the document's html, head and
     body tags.  Everything above the body marker goes into the head.  The styles and the player are those of the
     King's Land tutorials (source/simulator/tutorial.html and board.js). -->
<title>The Coach and the Physio</title>
<meta name="kings-land-page" content="coach">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen of a storybook lesson; the night map (the stage) on the left, the story and its formula on the
   right with one big Next; the chapters as a bar that fills along the bottom. */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #17212c;
  --muted: #546273;
  --line: #d3dbe4;
  --accent: #8f5a00;
  --accent-fill: #f5c25c;
  --accent-ink: #1b1406;
  --math-bg: #f4f6f9;
  --stage: #0b121b;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px;
}
.course { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.course-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.course-head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; text-wrap: balance; }
.count { font-family: var(--mono); font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-body { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.stage { position: relative; aspect-ratio: 16 / 11; max-width: 100%; background: var(--stage); border-radius: 12px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.story { box-sizing: border-box; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chapter { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.story h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.text { max-width: 65ch; }
.text kbd { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.math { font-family: var(--mono); font-size: 14px; line-height: 1.75; background: var(--math-bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; overflow-wrap: anywhere; }
.bp { opacity: 0.15; transition: opacity 0.3s; }
.bp.on { opacity: 1; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls button { font: inherit; font-size: 15px; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.controls button:hover { border-color: var(--accent); }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls #board-next { margin-left: auto; background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); font-weight: 700; padding: 10px 26px; font-size: 17px; }
.controls #board-next:disabled { opacity: 0.55; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.contents summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.contents ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; font-size: 14px; border-top: 1px solid var(--line); }
.contents .bl-chap { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 4px 2px; }
.contents .bl-step { display: flex; width: 100%; gap: 8px; padding: 3px 6px; border: 0; border-radius: 6px; cursor: pointer; background: transparent; color: inherit; font: inherit; text-align: left; }
.contents .bl-step span { min-width: 1.8em; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.contents .bl-step:hover { background: var(--math-bg); }
.contents .bl-step.on { background: var(--math-bg); font-weight: 700; }
.progress { display: flex; gap: 4px; }
.progress .seg { position: relative; flex-basis: 0; min-width: 0; height: 36px; border: 0; border-radius: 6px; background: var(--line); cursor: pointer; overflow: hidden; padding: 0 8px; text-align: left; color: var(--ink); font: inherit; }
.progress .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-fill); opacity: 0.55; transition: width 0.3s; }
.progress .seg.on .fill { opacity: 0.9; }

.progress .seg.on .name { font-weight: 700; }

  .course-body { grid-template-columns: minmax(0, 1fr); }
  .stage { aspect-ratio: 4 / 5; }
  .story h2 { font-size: 23px; }
  .progress .name { display: none; }
  .progress .seg { height: 12px; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { .bp, .progress .fill { transition: none; } }

<body>
<main class="course" id="board">
  <header class="course-head">
    <div>
      <div class="eyebrow">Optimization with constraints · a training-plan case study</div>
      <h1 id="board-title">The Coach and the Physio</h1>
    </div>
    <span class="count" id="board-count"></span>
  </header>
  <div class="course-body">
    <div class="stage"><canvas id="board-canvas" aria-label="Animated illustration for the current tutorial step" aria-describedby="board-step board-text board-math"></canvas></div>
    <section class="story" aria-live="polite">
      <div class="chapter" id="board-chapter"></div>
      <h2 id="board-step"></h2>
      <div class="text" id="board-text"></div>
      <div class="math" id="board-math"></div>
      <div class="controls">
        <button type="button" id="board-prev">← Back</button>
        <button type="button" id="board-replay" title="Play this step’s animation again">↻ Replay</button>
        <button type="button" id="board-play" aria-pressed="false">⏵ Play</button>
        <button type="button" id="board-next">Next →</button>
      </div>
      <details class="contents"><summary>Contents</summary><ol id="board-list"></ol></details>
    </section>
  </div>
  <nav class="progress" id="progress" aria-label="Chapters"></nav>
</main>
<script>
// The step-by-step board of kings_land_descent.html.  It cuts one day's reckoning of a hero (or yours, after you feel
// the slope) into small steps.  Each step has a few plain words, its formula with that day's numbers, and an
// animation on a flat chart of the land: where the hero stands, how the height is made, the four taps, the slopes
// they give, and the hero's move.  game.js opens the board with the day's context; Board.register adds the steps of
// one part of the reckoning (this file holds the parts every hero shares, board_parts.js the others).
//
// A step is { id, chapter, title, text, math, layout, view, dur, draw }:

//   view    the part of the land the map shows, [x1min, x1max, x2min, x2max]; the board glides from one view to the next;
//   dur     seconds the animation takes; text and math are HTML, and a part wrapped by at(p, html) shows from

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function len(a) { return Math.hypot(a[0], a[1]); }
  function scale(a, s) { return [a[0] * s, a[1] * s]; }

    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max((x1 - x0) * (1 + grow), (y1 - y0) * (1 + grow), least);

  var HERO = { pg: { col: '#ffb071', letter: 'P' }, lb: { col: '#a9cdf6', letter: 'C' }, tw: { col: '#e6e9ee', letter: 'W' }, you: { col: '#ffd27a', letter: 'Y' } };

    o = o || {};

<script>
// The training-plan case study of the tutorial "The Coach and the Physio" (the_coach_and_the_physio.html): an
// athlete's next hard session is one plan q = (t, w), the day it happens and its load.  The Coach wants the session
// with the greatest training benefit, read off the predicted readiness curve; the Physio keeps the session inside a
// set of safety rules.  The two negotiate with ADMM in scaled form: the Coach's copy x, the Physio's copy z, a
// tether of stiffness rho, and the planning log u.  After the session happens, the readiness curve changes and the
// next plan is negotiated: the recovery cycle is the outer loop, ADMM the inner one.  Plain JavaScript (Node 12).
var Plan = (function () {
  function copy(o, extra) { var r = {}, k; for (k in o) r[k] = o[k]; for (k in (extra || {})) r[k] = extra[k]; return r; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function scale(a, s) { return [a[0] * s, a[1] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function norm(a) { return Math.hypot(a[0], a[1]); }

  // ---------------------------------------------------------------- the body: the readiness curve
  // Every hard session leaves two traces that fade at different speeds: fitness, small and slow (k1, tau1), and
  // fatigue, large and fast (k2, tau2).  Readiness is their sum over the sessions done so far, on top of the rested
  // baseline 1: a dip right after a session, a recovery, a crest (the supercompensation), and a return to baseline.
  function readiness(history, p) {
    return function (t) {
      var r = 1;
      for (var i = 0; i < history.length; i++) {
        var dt = t - history[i].t; if (dt < 0) continue;
        r += history[i].w / p.wRef * (p.k1 * Math.exp(-dt / p.tau1) - p.k2 * Math.exp(-dt / p.tau2));
      }
      return r;
    };
  }
  // the crest of one session's trace, in days after it (where fitness minus fatigue is largest)
  function crestOf(p) { return p.tau1 * p.tau2 / (p.tau1 - p.tau2) * Math.log(p.k2 * p.tau1 / (p.k1 * p.tau2)); }

  // ---------------------------------------------------------------- the Coach: the benefit of a session
  // A session of load w on a day of readiness r gains w * (r - r0), less a * w^2 for doing too much at once; below
  // readiness r0 a session does harm.  The Coach's cost is minus the benefit.
  function benefit(r, p) { return function (q) { return q[1] * (r(q[0]) - p.r0) - p.a * q[1] * q[1]; }; }
  // tMin: a plan cannot come before the last session, so the map is flat there (no cliff at day 0 in the shading)
  function cost(r, p, tMin) { var b = benefit(r, p); return function (q) { return -b(tMin == null ? q : [Math.max(q[0], tMin), q[1]]); }; }
  // the lowest point of a function of one number on [lo, hi]: a fine grid, then golden-section refinement
  function argmin1(f, lo, hi, n) {
    n = n || 1200; var best = lo, bv = Infinity, i;
    for (i = 0; i <= n; i++) { var t = lo + (hi - lo) * i / n, v = f(t); if (v < bv) { bv = v; best = t; } }
    var a = Math.max(lo, best - (hi - lo) / n), b = Math.min(hi, best + (hi - lo) / n), gr = (Math.sqrt(5) - 1) / 2;
    var c = b - gr * (b - a), d = a + gr * (b - a), fc = f(c), fd = f(d);
    for (i = 0; i < 60; i++) { if (fc < fd) { b = d; d = c; fd = fc; c = b - gr * (b - a); fc = f(c); } else { a = c; c = d; fc = fd; d = a + gr * (b - a); fd = f(d); } }
    var m = (a + b) / 2; return { t: m, v: f(m) };
  }
  // The Coach's step: the lowest point of cost + rho/2 |q - v|^2.  For each day t the load is exact,
  // w(t) = (g(t) + rho v_w) / (2a + rho) with g = r - r0; what remains is one number, t, searched on a fine grid.
  // With rho -> 0 this is the Coach's own best session, the crest of the curve with load g / 2a.
  function coachStep(prob, v, rho) {
    var p = prob.p, g = function (t) { return prob.r(t) - p.r0; };
    function wOf(t) { return (g(t) + rho * v[1]) / (2 * p.a + rho); }
    function h(t) { var w = wOf(t), gt = g(t); return -w * gt + p.a * w * w + rho / 2 * ((t - v[0]) * (t - v[0]) + (w - v[1]) * (w - v[1])); }
    var m = argmin1(h, p.tRange[0], p.tRange[1]);

  }

  // ---------------------------------------------------------------- the Physio: the rules, a convex polygon
  // Each rule is a half-plane a.q <= b of the plan q = (t, w): the day comes after the recovery time, the load is
  // at most `ramp` times the last session's, the load allowed grows with the days of rest taken (the workload
  // rule), the session leaves `taper` days before the race, and a load is not negative.
  function rules(history, p) {
    var last = history[history.length - 1];
    return [
      { id: 'recovery', a: [-1, 0], b: -(last.t + p.recovery), name: 'recovery: at least ' + p.recovery + ' days after the last hard session', short: 't ≥ ' + fmt(last.t + p.recovery) },
      { id: 'ramp', a: [0, 1], b: p.ramp * last.w, name: 'ramp: at most ' + Math.round((p.ramp - 1) * 100) + '% more load than last time', short: 'w ≤ ' + fmt(p.ramp * last.w) },
      { id: 'workload', a: [-p.s, 1], b: p.w0 - p.s * last.t, name: 'workload: the load allowed grows with the rest taken', short: 'w ≤ ' + fmt(p.w0) + ' + ' + fmt(p.s) + '·(t − ' + fmt(last.t) + ')' },
      { id: 'taper', a: [1, 0], b: p.race - p.taper, name: 'taper: no hard session in the last ' + p.taper + ' days before the race (day ' + p.race + ')', short: 't ≤ ' + fmt(p.race - p.taper) },
      { id: 'load', a: [0, -1], b: 0, name: 'a load is not negative', short: 'w ≥ 0' }
    ];
  }
  function fmt(v) { var s = (Math.round(v * 100) / 100).toString(); return s; }
  function satisfied(rl, q, tol) { tol = tol == null ? 1e-9 : tol; return dot(rl.a, q) <= rl.b + tol; }
  function inside(rs, q, tol) { for (var i = 0; i < rs.length; i++) if (!satisfied(rs[i], q, tol)) return false; return true; }
  // the polygon of all the rules: a big box cut by each half-plane in turn (Sutherland–Hodgman)
  function polygon(rs, p) {
    var box = [[p.tRange[0] - 5, p.wRange[0] - 5], [p.tRange[1] + 5, p.wRange[0] - 5], [p.tRange[1] + 5, p.wRange[1] + 5], [p.tRange[0] - 5, p.wRange[1] + 5]], poly = box;
    rs.forEach(function (rl) {
      var out = [];
      for (var i = 0; i < poly.length; i++) {
        var A = poly[i], B = poly[(i + 1) % poly.length], fa = rl.b - dot(rl.a, A), fb = rl.b - dot(rl.a, B);
        if (fa >= 0) out.push(A);
        if ((fa >= 0) !== (fb >= 0)) { var s = fa / (fa - fb); out.push([A[0] + s * (B[0] - A[0]), A[1] + s * (B[1] - A[1])]); }
      }
      poly = out;
    });
    var area = 0; for (var i = 0; i < poly.length; i++) { var A = poly[i], B = poly[(i + 1) % poly.length]; area += A[0] * B[1] - B[0] * A[1]; }
    return { verts: poly, area: Math.abs(area) / 2, empty: poly.length < 3 || Math.abs(area) < 1e-9 };
  }
  // the Physio's step: the nearest point of the polygon, exact (the point itself if inside, else the nearest point of
  // the nearest edge)
  function project(poly, rs, q) {
    if (inside(rs, q)) return q.slice();

      g.labelPx(RR[0] + 16, RR[1] + 163, '4. the aim      v₂ = ' + pr2(v), C.gold, { plain: true, mono: true, p: seg(q, 0.68, 0.9) });
    } });

  var step2 = N.coachStep(pr, v, rho), ropeV = function (q0) { var dq = sub(q0, v); return pr.J(q0) + rho / 2 * (dq[0] * dq[0] + dq[1] * dq[1]); };
  out.push({ id: 'coach', chapter: CH.round, title: 'The Coach’s step: scan the days, then the load', layout: 'map+side', view: around([x1, v, x], 0.6, 3.5), dur: 5.8,
    text: 'The Coach is told: find the lowest point of the cost plus a tether to v₂ = ' + plan(v) + '. For each day t the best load is a formula, w = (r(t) − ' + num(p.r0, 1) + ' + ρ·v<sub>w</sub>)/(2·' + num(p.a, 2) + ' + ρ); what remains is one number, the day, which the Coach finds by scanning the days and keeping the lowest. The panel shows that scan. Lowest on day ' + num(x[0], 2) + ', then w = ' + num(x[1], 2) + ': x₂ = ' + plan(x) + '. The shading is the map plus the tether, as the Coach feels it this round.',
    math: 'w(t) = (r(t) − r₀ + ρ·v<sub>w</sub>)/(2a + ρ)' + at(0.45, ';  scan t: lowest on day ' + num(x[0], 2)) + at(0.8, ';  x₂ = ' + pr2(x)),
    draw: function (g, q) {
      g.land(ropeV, { id: 'ropeV', rings: 10 }); P.axes(g, 'day of the session →', '↑ load'); P.polygon(g, pr.poly.verts);
      g.dot(v, 6, AIM, 1); g.label(v, 'the aim v₂', AIM, { dx: 10, dy: 16, size: 12 });
      var s = seg(q, 0.62, 0.95), pos = lerp2(x1, x, s); g.path([x1, x], C.ink, 2, s, [4, 3]);
      P.spring(g, pos, v, 1); P.coach(g, pos, 1, s >= 1 ? 'x₂ = ' + pr2(x) : s <= 0 ? 'x₁' : '', { dx: 12, dy: -14 });
      P.scanPanel(g, g.sideR, { along: step2.along, t: [0, 12], title: 'the Coach’s scan: cost + tether, per day', scan: seg(q, 0.08, 0.58), best: [x[0], step2.value], bestP: seg(q, 0.58, 0.7), label: 'lowest: day ' + num(x[0], 2) });
    } });

  out.push({ id: 'physio', chapter: CH.round, title: 'The Physio’s step', layout: 'map', view: around([x, xu, z, v], 0.6, 3), dur: 4.6,
    text: 'Now the Physio moves, with the new x₂ and the start-of-round log u₁ held fixed. It starts from the Coach’s plan plus the log, x₂ + u₁ = ' + pr2(x) + ' + ' + pr2(u1) + ' = ' + pr2(xu) + ', and steps straight to the nearest safe plan: z₂ = ' + plan(z) + ', on the workload line. Why add the log? The same tether cost, |x − z + u|² = |z − (x + u)|², is smallest at the safe z nearest x + u.',
    math: '|x − z + u|² = |z − (x + u)|²' + at(0.42, '<br>z₂ = Π<sub>C</sub>(x₂ + u₁)') + at(0.75, ' = Π<sub>C</sub>' + pr2(xu) + ' = ' + pr2(z)),
    draw: function (g, q) {
      base(g); P.coach(g, x, 1, 'x₂', { dx: 12, dy: 14 });
      g.arrow(x, xu, LOG, 2, seg(q, 0.1, 0.35)); g.dot(xu, 5, C.ink, seg(q, 0.3, 0.4)); g.label(xu, 'x₂ + u₁', C.ink, { dx: -10, dy: -14, align: 'right', p: seg(q, 0.35, 0.5) });
      g.line(xu, z, PHYSIO, 2, seg(q, 0.5, 0.75), [5, 4]); P.rightAngle(g, z, xu, seg(q, 0.7, 0.85));
      P.physio(g, z, seg(q, 0.7, 0.85), 'z₂, the nearest safe plan', { dx: 14, dy: 16 });
    } });

  out.push({ id: 'ledger', chapter: CH.round, title: 'The log, updated', layout: 'map', view: around([z, add(z, u1), add(z, u), x], 1.2, 3.5), dur: 4.6,
    text: 'The Physio writes this round’s gap into the log: u₂ = u₁ + (x₂ − z₂) = ' + pr2(u1) + ' + ' + pr2(gap) + ' = ' + pr2(u) + '. The Coach asked for earlier and heavier again, so the entry grows. A small gap means the two nearly agree. But agreement alone is not enough to stop: the Physio must also have stopped moving. When all is settled the log holds the rule’s toll: ρu is the force with which the workload rule holds the Coach back.',
    math: 'u₂ = u₁ + x₂ − z₂' + at(0.45, '<br>= ' + pr2(u1) + ' + ' + pr2(gap)) + at(0.85, ' = ' + pr2(u)),
    draw: function (g, q) {
      base(g); g.dot(z, 7, PHYSIO, 1); g.label(z, 'z₂', PHYSIO, { dx: 10, dy: 18, size: 12 }); P.coach(g, x, 1, 'x₂', { dx: 12, dy: -14 });
      var tipOld = add(z, u1);
      g.arrow(z, tipOld, 'rgba(255,176,113,0.55)', 2.5, seg(q, 0.05, 0.3)); g.label(lerp2(z, tipOld, 0.25), 'old log u₁', 'rgba(255,176,113,0.9)', { dx: 12, dy: 10, p: seg(q, 0.2, 0.4), size: 12 });
      g.arrow(tipOld, add(tipOld, gap), AIM, 2.5, seg(q, 0.35, 0.6)); g.label(lerp2(tipOld, add(tipOld, gap), 0.5), '+ this round’s gap', AIM, { dx: 12, dy: -6, p: seg(q, 0.5, 0.65), size: 12 });
      g.arrow(z, add(z, u), LOG, 3.5, seg(q, 0.65, 0.9)); g.tipLabel(add(z, u), u, 'new log u₂ = ' + pr2(u), LOG, seg(q, 0.85, 1));
    } });

  var ahead = R.slice(K), xs = ahead.map(function (r) { return r.x; }), zs = ahead.map(function (r) { return r.z; }), nA = ahead.length - 1;
  out.push({ id: 'again', chapter: CH.round, title: 'Round after round, until they agree', layout: 'map+side', view: around(xs.concat(zs), 0.6, 2.5), dur: 6,
    text: 'Each round repeats the four moves: the aim, the Coach’s step, the Physio’s step, the log. Here are the rounds from the second on. The two stop only when both gauges are small: the gap between them, |x − z|, the primal residual, and the Physio’s move since the last round times ρ, the dual residual. Agreement alone is not enough: a Physio still on the move has not settled on the plan. Stability alone is not enough: a settled Physio the Coach still disagrees with has no plan to file. Both gauges are below ' + num(p.tol, 2) + ' after round ' + K_END + ': ' + num(fin.primal, 4) + ' and ' + num(fin.dual, 4) + '.',
    math: 'stop when |x − z| and ρ·|z<sub>new</sub> − z<sub>old</sub>| are both small' + at(0.6, ';  round ' + K_END + ': ' + num(fin.primal, 4) + ' and ' + num(fin.dual, 4)),
    draw: function (g, q) {
      base(g); P.star(g, best, 1); var s = seg(q, 0.05, 0.85) * nA, kk = Math.floor(s), f2 = s - kk;
      g.path(xs.slice(0, kk + 1).concat(kk < nA ? [lerp2(xs[kk], xs[kk + 1], ease(f2))] : []), 'rgba(230,233,238,0.8)', 2, 1);
      g.path(zs.slice(0, kk + 1).concat(kk < nA ? [lerp2(zs[kk], zs[kk + 1], ease(f2))] : []), PHYSIO, 2, 1);
      for (var m = 1; m <= Math.min(kk, nA); m++) { g.dot(xs[m], 3, COACH, 1); g.dot(zs[m], 3, PHYSIO, 1); }
      var hx = kk < nA ? lerp2(xs[kk], xs[kk + 1], ease(f2)) : xs[nA], hz = kk < nA ? lerp2(zs[kk], zs[kk + 1], ease(f2)) : zs[nA];
      P.spring(g, hx, hz, 1); P.physio(g, hz, 1); g.halo(hz, 15, PHYSIO, 1, 2); P.coach(g, hx, 1); g.labelPx(g.mapR[0] + 12, g.mapR[1] + 30, 'round ' + (K + Math.min(kk, nA)), C.gold, { size: 13 });
      P.gaugePanel(g, g.sideR, R, q, { upto: (K + s) / K_END, tol: p.tol });
    } });

  var lastRows = R.slice(Math.max(1, K_END - 2)).map(function (r) { return { text: 'round ' + r.k + ':  gap ' + num(r.primal, 4) + ',  ρ × move ' + num(r.dual, 4) + (r.primal <= p.tol && r.dual <= p.tol ? '  ✓' : ''), col: r.k === K_END ? C.gold : C.ink, mono: true }; });
  out.push({ id: 'ready', chapter: CH.round, title: 'When is the plan ready?', layout: 'map+side', view: around([best, z1, x1], 1.0, 2.5), dur: 5,
    text: 'After round ' + K_END + ' the gap is ' + num(fin.primal, 4) + ' and the Physio’s move times ρ is ' + num(fin.dual, 4) + ': both gauges are below ' + num(p.tol, 2) + ', so the Coach and the Physio put their names to one plan, z' + subscript(K_END) + ' = ' + plan(fin.z) + '. It is the star, the best safe session, found without anyone ever scoring the whole safe set: the Coach only ever scored, the Physio only ever kept the rules, and the log carried their disagreement across the rounds. The plan goes to the athlete: a hard session on day ' + num(fin.z[0], 2) + ' with a load of ' + num(fin.z[1], 2) + ', inside every rule.',
    math: 'the plan: (t, w) = ' + pr2(fin.z) + ';  the star ' + pr2(best) + at(0.6, '<br>the log settled at u = ' + pr2(fin.u) + ':  ρu = ' + pr2(scale(fin.u, rho)) + ' is the workload rule’s toll'),
    draw: function (g, q) {
      base(g); P.star(g, best, 1, 'the best safe session', { dx: -14, dy: 18, align: 'right' });
      g.path(R.slice(1).map(function (r) { return r.x; }), 'rgba(230,233,238,0.45)', 1.5, seg(q, 0, 0.3), [3, 3]); g.path(R.slice(1).map(function (r) { return r.z; }), 'rgba(169,205,246,0.5)', 1.5, seg(q, 0, 0.3), [3, 3]);
      P.spring(g, fin.x, fin.z, seg(q, 0.3, 0.4)); P.physio(g, fin.z, seg(q, 0.3, 0.45)); P.coach(g, fin.x, seg(q, 0.35, 0.5), 'x = z: one plan', { dx: 14, dy: -16 });
      var tollTip = add(fin.z, scale(fin.u, 0.4)); g.arrow(fin.z, tollTip, LOG, 2.5, seg(q, 0.55, 0.8)); g.label(lerp2(fin.z, tollTip, 0.5), 'the settled log: the rule’s toll', LOG, { dx: 12, dy: -4, p: seg(q, 0.75, 0.9), size: 12 });
      P.lines(g, g.sideR, lastRows.concat([{ text: 'both below ' + num(p.tol, 2) + ': file the plan', col: C.gold }, { text: 'session: day ' + num(fin.z[0], 2) + ', load ' + num(fin.z[1], 2), col: C.gold }]), q, 'The two gauges');
    } });

  // ------------------------------------------------------------ 4. the season
  var s1 = d.sessions[0], crest1 = pr1.crest, free1 = pr1.free, best1 = pr1.best.q;
  out.push({ id: 'trained', chapter: CH.season, title: 'The athlete trains, and the curve moves', layout: 'map+side', view: VIEW, dur: 6.4,
    text: 'The athlete does the session on day ' + num(s1.t, 2) + '. The body answers again: a new dip, a new recovery, and a crest on day ' + num(crest1, 2) + ' that is higher than the last, ' + num(pr1.r(crest1), 2) + ' against ' + num(rCrest, 2) + ', because the fitness of the earlier session is still there. The planning problem is rebuilt from the new curve and the new last session: recovery now says t ≥ ' + num(-rule1('recovery').b, 2) + ', ramp w ≤ ' + num(rule1('ramp').b, 2) + ', workload w ≤ ' + num(p.w0, 0) + ' + ' + num(p.s, 1) + '·(t − ' + num(s1.t, 2) + '); the taper line stays at day ' + num(rule1('taper').b, 0) + '. The map is new, the safe set is new, and the Coach’s favourite moved to ' + plan(free1) + '. The recovery cycle is the outer loop; the negotiation is the inner one.',
    math: 'history: day 0 (load ' + num(last.w, 1) + '), day ' + num(s1.t, 2) + ' (load ' + num(s1.w, 2) + ')' + at(0.5, '<br>new rules: t ≥ ' + num(-rule1('recovery').b, 2) + ',  w ≤ ' + num(rule1('ramp').b, 2) + ',  w ≤ ' + num(p.w0, 0) + ' + ' + num(p.s, 1) + '·(t − ' + num(s1.t, 2) + '),  t ≤ ' + num(rule1('taper').b, 0)),
    draw: function (g, q) {
      g.land(pr1.J, shade1); P.axes(g, 'day of the session →', '↑ load');
      P.polygon(g, pr.poly.verts, { p: seg(q, 0.05, 0.2), fill: false, dash: [4, 4], col: 'rgba(169,205,246,0.45)' });
      g.dot([s1.t, s1.w], 6, C.gold, seg(q, 0.05, 0.2)); g.label([s1.t, s1.w], 'session 1, done', C.gold, { dx: -12, dy: 18, align: 'right', p: seg(q, 0.1, 0.25), size: 12 });
      P.polygon(g, pr1.poly.verts, { p: seg(q, 0.35, 0.55) }); g.label([8.8, 1.6], 'the new safe set', PHYSIO, { align: 'center', p: seg(q, 0.5, 0.65), size: 12 });
      P.coach(g, free1, seg(q, 0.65, 0.8), 'the new favourite ' + plan(free1), { dx: -14, dy: 18, align: 'right' }); P.star(g, best1, seg(q, 0.8, 0.95), 'the next best safe session', { dx: 0, dy: 22, align: 'center' });
      P.curvePanel(g, g.sideR, { r: pr1.r, rOld: pr.r, old: 'before session 1', oldAt: 9.5, t: [0, 12], v: [0.3, 1.8], p: q, title: 'readiness, with session 1 done', r0: p.r0, from: 0.3, to: 0.7,
        sessions: [{ t: 0, w: last.w, text: 'day 0' }, { t: s1.t, w: s1.w, text: 'day ' + num(s1.t, 2) }], marks: [{ t: crest1, text: 'new crest ' + num(pr1.r(crest1), 2) + ' on day ' + num(crest1, 2), at: 0.62, side: 'left' }] });
    } });

  var xs1 = R1.map(function (r) { return r.x; }), zs1 = R1.map(function (r) { return r.z; }), n1 = R1.length - 1, fin1 = S1.final, nextRec = third ? third.prob.rules.filter(function (r) { return r.id === 'recovery'; })[0] : null;
  out.push({ id: 'next', chapter: CH.season, title: 'The next negotiation', layout: 'map+side', view: around(xs1.concat(zs1).concat([best1]), 0.6, 3.5), dur: 6.4,
    text: 'The same four moves on the new map, from the Coach’s new favourite. In ' + n1 + ' rounds both gauges are below ' + num(p.tol, 2) + ' and the two put their names to z = ' + plan(fin1.z) + ': a hard session on day ' + num(fin1.z[0], 2) + ' with a load of ' + num(fin1.z[1], 2) + ', on the workload line, ' + num(rule1('taper').b - fin1.z[0], 1) + ' days before the taper. Then the rules close the window: the next hard session could not come before day ' + (nextRec ? num(-nextRec.b, 2) : '—') + ', after the taper has begun. The next thing on the calendar is the race.',
    math: 'plan 2: ' + pr2(fin1.z) + ' after ' + n1 + ' rounds' + at(0.6, ';  plan 3: recovery t ≥ ' + (nextRec ? num(-nextRec.b, 2) : '—') + ' and taper t ≤ ' + num(rule1('taper').b, 0) + ' leave no safe session: the race'),
    draw: function (g, q) {
      g.land(pr1.J, shade1); P.axes(g, 'day of the session →', '↑ load'); P.polygon(g, pr1.poly.verts); P.star(g, best1, 1);
      var s = seg(q, 0.05, 0.85) * n1, kk = Math.floor(s), f2 = s - kk;
      g.path(xs1.slice(0, kk + 1).concat(kk < n1 ? [lerp2(xs1[kk], xs1[kk + 1], ease(f2))] : []), 'rgba(230,233,238,0.8)', 2, 1);
      g.path(zs1.slice(0, kk + 1).concat(kk < n1 ? [lerp2(zs1[kk], zs1[kk + 1], ease(f2))] : []), PHYSIO, 2, 1);
      for (var m = 1; m <= Math.min(kk, n1); m++) { g.dot(xs1[m], 3, COACH, 1); g.dot(zs1[m], 3, PHYSIO, 1); }
      var hx = kk < n1 ? lerp2(xs1[kk], xs1[kk + 1], ease(f2)) : xs1[n1], hz = kk < n1 ? lerp2(zs1[kk], zs1[kk + 1], ease(f2)) : zs1[n1];
      P.spring(g, hx, hz, 1); P.physio(g, hz, 1); P.coach(g, hx, 1, kk >= n1 ? 'plan 2: ' + plan(fin1.z) : '', { dx: 14, dy: -16 }); g.labelPx(g.mapR[0] + 12, g.mapR[1] + 30, 'round ' + Math.min(kk, n1), C.gold, { size: 13 });
      P.gaugePanel(g, g.sideR, R1, q, { upto: s / n1, tol: p.tol });
    } });

  var calSessions = [{ t: 0, w: last.w, text: 'day 0: ' + num(last.w, 1), col: C.dim }].concat(d.sessions.map(function (s, i) { return { t: s.t, w: s.w, text: 'day ' + num(s.t, 2) + ': ' + num(s.w, 2) }; }));
  out.push({ id: 'block', chapter: CH.season, title: 'The block, and the line to remember', layout: 'side', dur: 6,
    text: 'The season so far: the last hard session on day 0, the two negotiated sessions on days ' + num(d.sessions[0].t, 2) + ' and ' + num(d.sessions[1].t, 2) + ', the taper, and the race on day ' + p.race + '. Every session was chosen the same way, and the way fits in one line. The curve tempts, the Physio constrains, the tether coordinates, and the planning log makes every unresolved disagreement return.',
    math: 'outer loop: train → measure → rebuild the curve and the rules → negotiate → train' + at(0.6, '<br>inner loop: aim → the Coach’s step → the Physio’s step → the log, until both gauges are small'),
    draw: function (g, q) { P.calendar(g, g.sideR, { race: p.race, taper: p.taper, sessions: calSessions, p: q, title: 'the training block' }); } });

  // ------------------------------------------------------------ 5. the same four moves elsewhere
  out.push({ id: 'bridge', chapter: CH.bridge, title: 'What this shares with a decoder', layout: 'side', dur: 6,
    text: 'The pattern is the one of the Twins in the King’s Land and of SAPPHIRE’s receiver. One shared unknown has two copies: one that minimises a cost and never looks at the constraints, one that is projected onto the constraint set and never looks at the cost. A tether of stiffness ρ ties the copies, and a log of signed disagreement shifts the aim. Here the copies are a training plan, the cost is minus the training benefit, and the set is a polygon of safety rules. In a decoder the copies are the bits of a codeword, the cost is the misfit to what was received, and the set is the parity rules. The four moves are the same; only the cost and the set change.',
    math: 'aim v = z − u  →  x = argmin J + ρ/2·|x − v|²  →  z = Π<sub>C</sub>(x + u)  →  u ← u + x − z',
    draw: function (g, q) { var RR = P.split(g.sideR, 0.5); P.lines(g, RR[0], [{ text: 'the unknown: a plan (t, w)', col: C.gold }, { text: 'the cost: minus the training benefit', col: COACH }, { text: 'the set: four safety rules, a polygon', col: PHYSIO }, { text: 'the projection: the nearest safe plan', col: PHYSIO }], q, 'Here'); P.lines(g, RR[1], [{ text: 'the unknown: the bits of a codeword', col: C.gold }, { text: 'the cost: the misfit to what was received', col: COACH }, { text: 'the set: the parity rules', col: PHYSIO }, { text: 'the projection: onto each parity rule', col: PHYSIO }], q, 'In a decoder'); } });

  out.push({ id: 'differences', chapter: CH.bridge, title: 'What is different', layout: 'side', dur: 5.6,
    text: 'Two unknowns here against thousands in a decoder, so the Coach can scan every day; a decoder cannot scan every codeword and takes a few taps of the staff instead. The rules here are four lines, so the Physio’s step is exact and cheap; parity rules are many, each with its own copy and its own log. And there is no cyclic redundancy check for a training plan: the test comes later, when the athlete trains and the next measurement says whether the curve was right.',
    math: 'same four moves;  different cost, set, size, and test',
    draw: function (g, q) { var RR = P.split(g.sideR, 0.5); P.lines(g, RR[0], [{ text: 'two unknowns: scan every day', col: COACH }, { text: 'four rules: one exact projection', col: PHYSIO }, { text: 'one log for the one plan', col: LOG }, { text: 'the test: the next measurement', col: C.gold }], q, 'The plan'); P.lines(g, RR[1], [{ text: 'thousands of bits: a few taps', col: COACH }, { text: 'many parity rules: one copy each', col: PHYSIO }, { text: 'one log per copy', col: LOG }, { text: 'the test: syndrome and CRC', col: C.gold }], q, 'The decoder'); } });

  // ------------------------------------------------------------ player, chapter bar, keyboard, and deep links
  var chapters = [];
  out.forEach(function (s, i) { if (!chapters.length || chapters[chapters.length - 1].name !== s.chapter) chapters.push({ name: s.chapter, start: i, n: 0 }); chapters[chapters.length - 1].n++; });
  var bar = document.getElementById('progress');
  if (bar) {
    bar.innerHTML = chapters.map(function (ch, k) { return '<button type="button" class="seg" data-k="' + k + '" style="flex-grow:' + ch.n + '" title="' + ch.name + '"><span class="fill"></span><span class="name">' + ch.name + '</span></button>'; }).join('');
    bar.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-k]') : null; if (b) B.go(chapters[+b.getAttribute('data-k')].start); });
  }
  B.onStep(function (i) {
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('[data-k]'), function (b, k) { var ch = chapters[k], f = clamp((i - ch.start + 1) / ch.n, 0, 1); b.querySelector('.fill').style.width = Math.round(f * 100) + '%'; b.classList.toggle('on', i >= ch.start && i < ch.start + ch.n); });
  });
  document.addEventListener('keydown', function (e) { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName) && (e.key === ' ' || e.key === 'Enter')) return; B.key(e); });
  B.openSteps(out, { embedded: true });
  window.course = { steps: out, chapters: chapters, plan: d };
  var hash = (window.location && window.location.hash) || '', ms = /step=([^&]+)/.exec(hash), mp = /p=([0-9.]+)/.exec(hash);
  if (ms) { var st = decodeURIComponent(ms[1]); B.debug({ step: /^\d+$/.test(st) ? +st : st, p: mp ? +mp[1] : 1 }); }
})();
</script>
<script>
// The roads of King’s Land Descent.  Six pages share one player (board.js): the game, the tale “Three heroes
// downhill”, the SAPPHIRE receiver tutorial and three case studies.  This file joins them.  A road starts on a step where
// the reader has just met an idea that another page uses, and it is offered in a card under that step’s formula.
// Taking it opens the other page with a short interlude played by the same player: the map of the King’s land with the
// road walked, a scene that sets up the new place, and a key of what changes name.  A bar at the top of every page lists

  function here() { var m = document.querySelector ? document.querySelector('meta[name="kings-land-page"]') : null; return (m && m.getAttribute('content')) || window.REALM_PAGE || null; }
  function init() {
    page = here(); if (!page || !PLACES[page] || !document.createElement) return;
    var h = parse(window.kingsLandHash != null ? window.kingsLandHash : window.location && window.location.hash); shot = 'step' in h || 'shot' in h || 'map' in h;
    try { var st = document.createElement('style'); st.textContent = CSS; (document.head || document.body).appendChild(st); } catch (e) { /* no styles in a test */ }
    barEl = document.createElement('nav'); barEl.className = 'realm-bar'; barEl.setAttribute('aria-label', 'King’s Land Descent pages; scroll horizontally for more');
    var host = page === 'game' ? document.querySelector('.wrap') : document.querySelector('main.course');
    if (host && host.insertBefore) host.insertBefore(barEl, host.firstChild);
    forkEl = document.createElement('aside'); forkEl.className = 'realm-fork'; forkEl.hidden = true; forkEl.setAttribute('aria-label', 'Roads to other pages');
    var math = $('board-math'); if (math && math.parentNode && math.parentNode.insertBefore) math.parentNode.insertBefore(forkEl, math.nextSibling);
    if (page === 'game') landRoads();
    stamp('seen');
    B.onAnyStep(watch);
    if (document.addEventListener) document.addEventListener('click', onClick);
    var r = h.via ? road(h.via) : null;
    if (r && r.to === page) { arrive(r, h.from, { trail: h.trail, full: h.full === '1' }); if (h.shot != null) B.debug({ step: +h.shot || 0, p: h.p != null ? +h.p : 1 }); }
    else if (h.map != null) { openMap(); if (h.p != null) B.debug({ step: 0, p: +h.p }); }
    else {
      var rr = h.ret && road(h.ret); if (rr && rr.to === page && validSource(rr, h.from)) ticket = { road: rr, from: h.from, playing: false, parent: unpackTrail(h.trail, rr.from) };
      if (h.at && page !== 'game' && !shot) { var k = idx(h.at); if (k >= 0) B.go(k); }
      if (h.at && page === 'game') {
        try { if (window.kingsLand && window.kingsLand.api) window.kingsLand.api.setLand(h.at); if (window.kingsLandHash && window.history) history.replaceState(null, '', window.kingsLandHash); } catch (e) { /* the game may not be ready in a test */ }
      }
    }
    renderBar(); var d = B.debug({}); if (d.open && !(r && r.to === page)) renderFork(d.id, d.road, d.i);
  }
  try { init(); } catch (e) { (window.kingsLandErrors = window.kingsLandErrors || []).push('realm: ' + (e && e.stack || e)); }

  // For tests: the data, the scenes, and the arrival and map without an address.
  return { PLACES: PLACES, ORDER: ORDER, ROADS: ROADS, SCENES: SCENES, MAP: MAP, terrain: terrain, roadSteps: roadSteps, mapStep: mapStep, road: road, ROAD_KINDS: ROAD_KINDS,
           PRIMARY_ROADS: PRIMARY_ROADS, SECONDARY_ROADS: SECONDARY_ROADS, MAP_ROADS: MAP_ROADS, offer: offer, predictionFor: predictionFor,
           arrive: function (id, from, o) { return arrive(road(id), from, o); }, openMap: openMap, page: function () { return page; }, ticket: function () { return ticket; }, glyph: glyph, keyDraw: keyDraw, realmMap: realmMap };
})();

<script>
// A phone reader reaches Next at the foot of a long story card.  Every change of step should bring the new
// animation back into view; wide screens keep their present position.  Watching the count also covers autoplay,
// keyboard, contents and chapter navigation without replacing the course's own step callback.
(function () {
  'use strict';
  var count = document.getElementById('board-count'), board = document.getElementById('board');
  if (!count || !board || !window.MutationObserver) return;
  new MutationObserver(function () {
    if (!window.matchMedia || !window.matchMedia('(max-width: 820px)').matches) return;
    requestAnimationFrame(function () { requestAnimationFrame(function () { board.scrollIntoView({ block: 'start', behavior: 'auto' }); }); });
  }).observe(count, { childList: true, characterData: true, subtree: true });
})();
</script>
