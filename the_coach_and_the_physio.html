<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The tutorial page "The Coach and the Physio"; build_plan.py inlines its scripts and adds the document's html, head and
     body tags.  Everything above the body marker goes into the head.  The styles and the player are those of the
     King's Land tutorials (source/simulator/tutorial.html and board.js). -->
<title>The Coach and the Physio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen of a storybook lesson; the night map (the stage) on the left, the story and its formula on the
   right with one big Next; the chapters as a bar that fills along the bottom. */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #17212c;
  --muted: #546273;
  --line: #d3dbe4;
  --accent: #8f5a00;
  --accent-fill: #f5c25c;
  --accent-ink: #1b1406;
  --math-bg: #f4f6f9;
  --stage: #0b121b;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px;
}
.course { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.course-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.course-head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; text-wrap: balance; }
.count { font-family: var(--mono); font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-body { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.stage { position: relative; aspect-ratio: 16 / 11; max-width: 100%; background: var(--stage); border-radius: 12px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.story { box-sizing: border-box; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chapter { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.story h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.text { max-width: 65ch; }
.text kbd { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.math { font-family: var(--mono); font-size: 14px; line-height: 1.75; background: var(--math-bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; overflow-wrap: anywhere; }
.bp { opacity: 0.15; transition: opacity 0.3s; }
.bp.on { opacity: 1; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls button { font: inherit; font-size: 15px; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.controls button:hover { border-color: var(--accent); }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls #board-next { margin-left: auto; background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); font-weight: 700; padding: 10px 26px; font-size: 17px; }
.controls #board-next:disabled { opacity: 0.55; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.contents summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.contents ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; font-size: 14px; border-top: 1px solid var(--line); }
.contents .bl-chap { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 4px 2px; }
.contents .bl-step { display: flex; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.contents .bl-step span { min-width: 1.8em; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.contents .bl-step:hover { background: var(--math-bg); }
.contents .bl-step.on { background: var(--math-bg); font-weight: 700; }
.progress { display: flex; gap: 4px; }
.progress .seg { position: relative; flex-basis: 0; min-width: 0; height: 36px; border: 0; border-radius: 6px; background: var(--line); cursor: pointer; overflow: hidden; padding: 0 8px; text-align: left; color: var(--ink); font: inherit; }
.progress .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-fill); opacity: 0.55; transition: width 0.3s; }
.progress .seg.on .fill { opacity: 0.9; }
.progress .name { position: relative; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.progress .seg.on .name { font-weight: 700; }
@media (max-width: 820px) {
  .course-body { grid-template-columns: minmax(0, 1fr); }
  .stage { aspect-ratio: 4 / 5; }
  .story h2 { font-size: 23px; }
  .progress .name { display: none; }
  .progress .seg { height: 12px; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { .bp, .progress .fill { transition: none; } }
</style>
</head>
<body>
<main class="course" id="board">
  <header class="course-head">
    <div>
      <div class="eyebrow">Optimization with constraints · a training-plan case study</div>
      <h1 id="board-title">The Coach and the Physio</h1>
    </div>
    <span class="count" id="board-count"></span>
  </header>
  <div class="course-body">
    <div class="stage"><canvas id="board-canvas" aria-label="Animated illustration for the current tutorial step" aria-describedby="board-step board-text board-math"></canvas></div>
    <section class="story" aria-live="polite">
      <div class="chapter" id="board-chapter"></div>
      <h2 id="board-step"></h2>
      <div class="text" id="board-text"></div>
      <div class="math" id="board-math"></div>
      <div class="controls">
        <button type="button" id="board-prev">← Back</button>
        <button type="button" id="board-replay" title="Play this step’s animation again">↻ Replay</button>
        <button type="button" id="board-play" aria-pressed="false">⏵ Play</button>
        <button type="button" id="board-next">Next →</button>
      </div>
      <details class="contents"><summary>Contents</summary><ol id="board-list"></ol></details>
    </section>
  </div>
  <nav class="progress" id="progress" aria-label="Chapters"></nav>
</main>
<script>
// The step-by-step board of kings_land_descent.html.  It cuts one day's reckoning of a hero (or yours, after you feel
// the slope) into small steps.  Each step has a few plain words, its formula with that day's numbers, and an
// animation on a flat chart of the land: where the hero stands, how the height is made, the four taps, the slopes
// they give, and the hero's move.  game.js opens the board with the day's context; Board.register adds the steps of
// one part of the reckoning (this file holds the parts every hero shares, board_parts.js the others).
//
// A step is { id, chapter, title, text, math, layout, view, dur, draw }:
//   layout  'map' (the land seen from above), 'map+side' (the map and a panel beside it) or 'side' (a panel only);
//   view    the part of the land the map shows, [x1min, x1max, x2min, x2max]; the board glides from one view to the next;
//   dur     seconds the animation takes; text and math are HTML, and a part wrapped by at(p, html) shows from
//           progress p of the animation on;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function seg(p, a, b) { return ease((p - a) / (b - a)); }

  function lerp2(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function add(a, b, s) { s = s == null ? 1 : s; return [a[0] + s * b[0], a[1] + s * b[1]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function len(a) { return Math.hypot(a[0], a[1]); }
  function scale(a, s) { return [a[0] * s, a[1] * s]; }
  function backOut(t) { var s = 1.6; t = clamp(t, 0, 1) - 1; return t * t * ((s + 1) * t + s) + 1; }
  function num(v, d) {
    if (v == null || !isFinite(v)) return '—';
    var s = v.toFixed(d == null ? 3 : d);
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return s.replace('-', '−');
  }
  function pair(v, d) { return '(' + num(v[0], d) + ', ' + num(v[1], d) + ')'; }
  // a number ready to be multiplied: negative numbers in brackets
  function par(v, d) { var t = num(v, d); return v < 0 && t !== '0.000' ? '(' + t + ')' : t; }

  function frac(a, b) { return '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; }

  function around(pts, grow, least) {
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach(function (q) { if (!q) return; x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max((x1 - x0) * (1 + grow), (y1 - y0) * (1 + grow), least);
    return [cx - w / 2, cx + w / 2, cy - w / 2, cy + w / 2];
  }

  var C = { bg: '#0b121b', ink: '#f2f5f8', dim: 'rgba(242,245,248,0.6)', faint: 'rgba(242,245,248,0.22)', gold: '#ffd27a',
            orange: '#ffb071', blue: '#a9cdf6', green: '#b9f0a8', red: '#ff9a8a', violet: '#d9c2ff', box: 'rgba(8,12,18,0.82)' };
  var HERO = { pg: { col: '#ffb071', letter: 'P' }, lb: { col: '#a9cdf6', letter: 'C' }, tw: { col: '#e6e9ee', letter: 'W' }, you: { col: '#ffd27a', letter: 'Y' } };

  // ------------------------------------------------------------ the drawing kit
  // Drawings in world spots keep inside the map's panel when a side panel shares the canvas.

    if (this.cv.width !== Math.round(W * dpr) || this.cv.height !== Math.round(H * dpr)) { this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr); }

    else if (kind === 'map+side') {

      else { var h = Math.round((H - 3 * m) * 0.55); this.mapR = [m, m, W - 2 * m, h]; this.sideR = [m, 2 * m + h, W - 2 * m, H - 3 * m - h]; }
    } else this.mapR = [m, m, W - 2 * m, H - 2 * m];
  };
  // The map: world spot q = (x1, x2) to canvas, x1 to the right and x2 up, one scale for both.
  Kit.prototype.view = function (v) {
    var R = this.mapR, vw = v[1] - v[0], vh = v[3] - v[2], s = Math.min(R[2] / vw, R[3] / vh);
    this.s = s; this.ox = R[0] + R[2] / 2 - (v[0] + v[1]) / 2 * s; this.oy = R[1] + R[3] / 2 + (v[2] + v[3]) / 2 * s;
    this.vis = [(R[0] - this.ox) / s, (R[0] + R[2] - this.ox) / s, (this.oy - R[1] - R[3]) / s, (this.oy - R[1]) / s];
  };
  Kit.prototype.P = function (q) { return [this.ox + q[0] * this.s, this.oy - q[1] * this.s]; };
  Kit.prototype.clip = function (R) { var c = this.ctx; c.save(); c.beginPath(); rrect(c, R[0], R[1], R[2], R[3], 8); c.clip(); };
  function rrect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function ramp(t) {
    var lo = [26, 58, 92], mid = [92, 112, 120], hi = [150, 98, 58], u = clamp(t, 0, 1);
    return u < 0.5 ? [mix(lo[0], mid[0], u * 2), mix(lo[1], mid[1], u * 2), mix(lo[2], mid[2], u * 2)] : [mix(mid[0], hi[0], u * 2 - 1), mix(mid[1], hi[1], u * 2 - 1), mix(mid[2], hi[2], u * 2 - 1)];
  }

  // range in view), o.rings the number of rings (spaced so that a bowl gets evenly spaced rings), o.id names fn.
  Kit.prototype.land = function (fn, o) {
    o = o || {};
    var R = this.mapR, v = this.vis, cell = o.cell || 4, nx = Math.max(40, Math.round(R[2] / cell)), ny = Math.max(30, Math.round(R[3] / cell));
    var key = (o.id || 'J') + '|' + v.map(function (a) { return a.toPrecision(7); }).join(',') + '|' + nx + 'x' + ny;
    var g = this.grid && this.grid.key === key ? this.grid : null;
    if (!g) {
      var vals = new Float64Array((nx + 1) * (ny + 1)), lo = Infinity, hi = -Infinity;
      for (var j = 0; j <= ny; j++) for (var i = 0; i <= nx; i++) {
        var z = fn([v[0] + (v[1] - v[0]) * i / nx, v[2] + (v[3] - v[2]) * j / ny]); vals[j * (nx + 1) + i] = z;

  };

  Kit.prototype.axes = function () {

<script>
// The training-plan case study of the tutorial "The Coach and the Physio" (the_coach_and_the_physio.html): an

// with the greatest training benefit, read off the predicted readiness curve; the Physio keeps the session inside a
// set of safety rules.  The two negotiate with ADMM in scaled form: the Coach's copy x, the Physio's copy z, a

(function () {

  var VIEW = [-0.4, 12.4, -0.4, 10.6];
  function rule(id) { return rules.filter(function (r) { return r.id === id; })[0]; }
  function rule1(id) { return pr1.rules.filter(function (r) { return r.id === id; })[0]; }
  function plan(q) { return '(' + num(q[0], 2) + ' d, ' + num(q[1], 2) + ')'; }
  function pr2(q) { return pair(q, 2); }
  function shadeOf(prob, id) {
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i <= 40; i++) for (var j = 0; j <= 40; j++) { var val = prob.J([VIEW[0] + (VIEW[1] - VIEW[0]) * i / 40, VIEW[2] + (VIEW[3] - VIEW[2]) * j / 40]); if (val < lo) lo = val; if (val > hi) hi = val; }
    return { lo: lo, hi: hi, id: id, rings: 12 };
  }
  var shade0 = shadeOf(pr, 'J0'), shade1 = shadeOf(pr1, 'J1');

    o = o || {}; var prob = o.prob || pr;

    if (o.poly !== false) P.polygon(g, prob.poly.verts, { p: o.polyP == null ? 1 : o.polyP });
  }
  // the Coach's walk downhill on its own map from a start to its favourite: a flow along the slope, for the eye
  function flow(prob, from) {
    var q = from.slice(), path = [q.slice()], h = 1e-4, step = 0.05;
    for (var i = 0; i < 600; i++) {
      var gt = (prob.J([q[0] + h, q[1]]) - prob.J([q[0] - h, q[1]])) / (2 * h), gw = (prob.J([q[0], q[1] + h]) - prob.J([q[0], q[1] - h])) / (2 * h), n = Math.hypot(gt, gw);
      if (n < 1e-6 || len(sub(q, prob.free)) < 0.06) break;
      q = [q[0] - step * gt / n, q[1] - step * gw / n]; path.push(q.slice());
    }
    path.push(prob.free.slice()); return path;
  }

    var L = 0, segL = [], i; for (i = 1; i < path.length; i++) { segL.push(len(sub(path[i], path[i - 1]))); L += segL[i - 1]; }
    var goal = L * clamp(q, 0, 1), pos = path[0];

    math: 'readiness r(t) = 1 + fitness − fatigue = 1 + k₁e^(−t/τ₁) − k₂e^(−t/τ₂)' + at(0.3, ';  τ₁ = ' + p.tau1 + ' d, τ₂ = ' + p.tau2 + ' d') + at(0.6, '<br>dip r(0) = ' + num(rDip, 2) + ';  crest r(' + num(crest, 2) + ') = ' + num(rCrest, 2)),

        marks: [{ t: 0.02, text: 'the dip: ' + num(rDip, 2), at: 0.22, side: 'right' }, { t: crest, text: 'the crest: ' + num(rCrest, 2) + ' on day ' + num(crest, 2), at: 0.36 }, { t: 11, text: 'back toward the baseline', at: 0.7, side: 'left' }] });

      g.halo(free, 16, C.gold, seg(q, 0.5, 0.7), 1.5); P.coach(g, free, seg(q, 0.55, 0.75), 'c, the Coach’s favourite: ' + plan(free), { dx: 16, dy: -14 });
    } });

  var ruleRows = [
    { id: 'recovery', label: 'recovery: t ≥ ' + num(rule('recovery').b * -1, 0), at: 0.82, dx: 8, align: 'left' },
    { id: 'ramp', label: 'ramp: w ≤ ' + num(rule('ramp').b, 1), at: 0.68, dy: -14 },
    { id: 'workload', label: 'workload: w ≤ ' + num(p.w0, 0) + ' + ' + num(p.s, 1) + '·t', at: 0.5, dx: -12, dy: -6, align: 'right' },
    { id: 'taper', label: 'taper: t ≤ ' + num(rule('taper').b, 0), at: 0.9, dx: -8, align: 'right' }];
  out.push({ id: 'rules', chapter: CH.athlete, title: 'The Physio’s rules: the safe plans', layout: 'map', view: VIEW, dur: 6.4,
    text: 'The Physio reads the same plan against four rules. Recovery: at least ' + p.recovery + ' days after the last hard session. Ramp: at most ' + Math.round((p.ramp - 1) * 100) + '% more load than last time, so w ≤ ' + num(rule('ramp').b, 1) + '. Workload: the load allowed grows with the rest taken, w ≤ ' + num(p.w0, 0) + ' + ' + num(p.s, 1) + '·t, the acute-to-chronic workload ratio written for one session. Taper: no hard session in the last ' + p.taper + ' days before the race on day ' + p.race + '. Each rule is a line with a forbidden side; the plans that keep all four form the safe set C, a polygon. The Coach’s favourite lies outside it: too much load for the rest taken.',
    math: 't ≥ ' + num(-rule('recovery').b, 0) + ',  w ≤ ' + num(rule('ramp').b, 1) + ',  w ≤ ' + num(p.w0, 0) + ' + ' + num(p.s, 1) + '·t,  t ≤ ' + num(rule('taper').b, 0) + at(0.8, ';  C: all four at once.  c = ' + pr2(free) + ' breaks the ramp and workload rules'),

  out.push({ id: 'one', chapter: CH.athlete, title: 'One athlete, one next session', layout: 'map', view: VIEW, dur: 5.6,

      g.label([7.0, 6.2], 'both must end on the star', AIM, { align: 'center', p: seg(q, 0.8, 1), size: 12 });

  // ------------------------------------------------------------ 2. the Coach and the Physio
  var introView = around([free, freeZ, best], 1.2, 5), walk = flow(pr, [7.2, 9.2]);
  out.push({ id: 'coach-role', chapter: CH.pair, title: 'Meet the Coach: x', layout: 'map', view: introView, dur: 5.4,
    text: 'The Coach’s job: find the lowest point of whatever it is asked to minimise. Asked about its own cost alone, it reads the curve, walks downhill to the crest and loads up: c = ' + plan(free) + ', the darkest spot of the map, J = ' + num(pr.freeJ, 2) + '. It never looks at the rules, and c breaks two of them: no use to the athlete on its own. But add any pull to the map, and the Coach will find the new lowest point just as surely. That is the skill the club hired.',

    text: 'The Physio’s job: given any plan, step to the nearest safe plan. A safe plan stays where it is; a plan outside C is pulled straight to the nearest rule line, at a right angle, or to a corner where two rules meet. Asked about the Coach’s favourite c, the Physio answers Π(c) = ' + plan(freeZ) + ': the corner of the ramp and workload lines. Safe, but not the best safe session: the star is ' + num(freeZ[0] - best[0], 1) + ' days earlier and a little lighter. The Physio never reads the curve, so on its own it cannot find the best safe session either.',

        if (qq > 0.7) { g.dot(s.z, 7, PHYSIO, seg(qq, 0.7, 1)); g.label(s.z, i === 2 ? 'Π(c): safe, not best' : moved ? 'nearest safe plan' : 'already safe: stays', PHYSIO, { dx: i === 2 ? 12 : 10, dy: i === 2 ? -16 : 14, p: seg(qq, 0.7, 1), size: 12 }); }

  out.push({ id: 'rope', chapter: CH.pair, title: 'Tie them with a tether', layout: 'map', view: around([free, freeZ, xr, best], 0.6, 4.5), dur: 5.8,
    text: 'Tie the two with a tether of stiffness ρ = ' + num(rho, 1) + '. Now the Coach minimises its cost plus the tether’s pull toward the Physio’s plan, and the Physio steps to the nearest safe plan to the Coach’s. Each still does only what it is good at; the tether makes them care about each other. The shading is the map as the Coach now feels it, the tether tied to the Physio at z = ' + plan(freeZ) + ': the cost ρ/2·|x − z|² is added. Pulled by the tether, the Coach moves from c to ' + plan(xr) + '. No plan farther than ' + num(reach, 2) + ' from the Physio can beat the Physio’s own: the dashed ring. A weaker tether lets them disagree more; a stiffer one keeps them closer and slows the Coach down.',

      var hx = kk >= nlN ? nlX[nlN] : lerp2(nlX[kk], nlX[kk + 1], ease(Math.min(1, fr * 2)));
      var hz = kk >= nlN ? nlZ[nlN] : fr < 0.5 ? nlZ[kk] : lerp2(nlZ[kk], nlZ[kk + 1], ease((fr - 0.5) * 2));

      g.labelPx(pl.X(nlN) - 4, pl.Y(hi * 0.22), 'with the log (next): the gap closes', PHYSIO, { align: 'right', size: 11.5, plain: true, p: seg(q, 0.9, 1) });
    } });

  var entries = []; for (var ej = 1; ej < K; ej++) entries.push({ k: ej, gap: sub(R[ej].x, R[ej].z) });
  out.push({ id: 'ledger-role', chapter: CH.pair, title: 'The planning log: u', layout: 'map+side', view: around([z1, x1, add(z1, u1)], 2.2, 4), dur: 5.8,
    text: 'So the Physio keeps a log. At the end of every round it writes down the gap, by how much and in which direction the Coach asked for more than it allowed: u ← u + (x − z). The log is not fatigue, fitness or training done; it records only how the two copies have disagreed. Repeated disagreement in one direction piles up; disagreement the other way cancels some of it. Round 1 ended with the Coach at x₁ = ' + plan(x1) + ' and the Physio at z₁ = ' + plan(z1) + ', so the first entry is the gap ' + pr2(sub(x1, z1)) + ': earlier and heavier than allowed. The log reads u₁ = ' + pr2(u1) + '. Next round the Physio will use it.',
    math: 'u<sub>k</sub> = u<sub>k−1</sub> + (x<sub>k</sub> − z<sub>k</sub>)' + at(0.5, ';  u₁ = (0, 0) + ' + pr2(sub(x1, z1)) + ' = ' + pr2(u1)),
    draw: function (g, q) {
      base(g);
      entries.forEach(function (e, i) { var qq = seg(q, 0.05 + 0.5 * i / entries.length, 0.2 + 0.5 * i / entries.length); g.arrow(R[e.k].z, R[e.k].x, AIM, 2.5, qq); });
      g.dot(z1, 7, PHYSIO, 1); g.label(z1, 'z₁', PHYSIO, { dx: 10, dy: 16, size: 12 }); P.coach(g, x1, 1, 'x₁', { dx: 12, dy: -14 });

  out.push({ id: 'aim', chapter: CH.round, title: 'Aim past the Physio: v = z − u', layout: 'map+side', view: around([z1, v, x1, add(z1, u1)], 1.2, Math.max(3, 1.4 * len(u1))), dur: 5,

  // ------------------------------------------------------------ 5. the same four moves elsewhere
  out.push({ id: 'bridge', chapter: CH.bridge, title: 'What this shares with a decoder', layout: 'side', dur: 6,
    text: 'The pattern is the one of the Twins in the King’s Land and of CAJODE’s receiver. One shared unknown has two copies: one that minimises a cost and never looks at the constraints, one that is projected onto the constraint set and never looks at the cost. A tether of stiffness ρ ties the copies, and a log of signed disagreement shifts the aim. Here the copies are a training plan, the cost is minus the training benefit, and the set is a polygon of safety rules. In a decoder the copies are the bits of a codeword, the cost is the misfit to what was received, and the set is the parity rules. The four moves are the same; only the cost and the set change.',

    text: 'Two unknowns here against thousands in a decoder, so the Coach can scan every day; a decoder cannot scan every codeword and takes a few taps of the staff instead. The rules here are four lines, so the Physio’s step is exact and cheap; parity rules are many, each with its own copy and its own log. And there is no cyclic redundancy check for a training plan: the test comes later, when the athlete trains and the next measurement says whether the curve was right.',
    math: 'same four moves;  different cost, set, size, and test',
    draw: function (g, q) { var RR = P.split(g.sideR, 0.5); P.lines(g, RR[0], [{ text: 'two unknowns: scan every day', col: COACH }, { text: 'four rules: one exact projection', col: PHYSIO }, { text: 'one log for the one plan', col: LOG }, { text: 'the test: the next measurement', col: C.gold }], q, 'The plan'); P.lines(g, RR[1], [{ text: 'thousands of bits: a few taps', col: COACH }, { text: 'many parity rules: one copy each', col: PHYSIO }, { text: 'one log per copy', col: LOG }, { text: 'the test: syndrome and CRC', col: C.gold }], q, 'The decoder'); } });

  // ------------------------------------------------------------ player, chapter bar, keyboard, and deep links
  var chapters = [];
  out.forEach(function (s, i) { if (!chapters.length || chapters[chapters.length - 1].name !== s.chapter) chapters.push({ name: s.chapter, start: i, n: 0 }); chapters[chapters.length - 1].n++; });
  var bar = document.getElementById('progress');
  if (bar) {
    bar.innerHTML = chapters.map(function (ch, k) { return '<button type="button" class="seg" data-k="' + k + '" style="flex-grow:' + ch.n + '" title="' + ch.name + '"><span class="fill"></span><span class="name">' + ch.name + '</span></button>'; }).join('');
    bar.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-k]') : null; if (b) B.go(chapters[+b.getAttribute('data-k')].start); });
  }
  B.onStep(function (i) {
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('[data-k]'), function (b, k) { var ch = chapters[k], f = clamp((i - ch.start + 1) / ch.n, 0, 1); b.querySelector('.fill').style.width = Math.round(f * 100) + '%'; b.classList.toggle('on', i >= ch.start && i < ch.start + ch.n); });
  });
  document.addEventListener('keydown', function (e) { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName) && (e.key === ' ' || e.key === 'Enter')) return; B.key(e); });
  B.openSteps(out, { embedded: true });
  window.course = { steps: out, chapters: chapters, plan: d };
  var hash = (window.location && window.location.hash) || '', ms = /step=([^&]+)/.exec(hash), mp = /p=([0-9.]+)/.exec(hash);
  if (ms) { var st = decodeURIComponent(ms[1]); B.debug({ step: /^\d+$/.test(st) ? +st : st, p: mp ? +mp[1] : 1 }); }
})();
</script>
<script>
// A phone reader reaches Next at the foot of a long story card.  Every change of step should bring the new
// animation back into view; wide screens keep their present position.  Watching the count also covers autoplay,
// keyboard, contents and chapter navigation without replacing the course's own step callback.
(function () {
  'use strict';
  var count = document.getElementById('board-count'), board = document.getElementById('board');
  if (!count || !board || !window.MutationObserver) return;
  new MutationObserver(function () {
    if (!window.matchMedia || !window.matchMedia('(max-width: 820px)').matches) return;
    requestAnimationFrame(function () { requestAnimationFrame(function () { board.scrollIntoView({ block: 'start', behavior: 'auto' }); }); });
  }).observe(count, { childList: true, characterData: true, subtree: true });
})();
</script>
