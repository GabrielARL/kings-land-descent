<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The tutorial page "Five receivers on the Red recordings"; build_ber.py inlines its scripts and adds the document's
     html, head and body tags.  Everything above the body marker goes into the head.  The styles and the player are
     those of the King's Land tutorials (source/soldiers/soldiers.html and source/simulator/board.js). -->
<title>Five receivers on the Red recordings</title>
<meta name="kings-land-page" content="red">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen of a storybook lesson; the night map (the stage) on the left, the story and its formula on the
   right with one big Next; the chapters as a bar that fills along the bottom. */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #17212c;
  --muted: #546273;
  --line: #d3dbe4;
  --accent: #8f5a00;
  --accent-fill: #f5c25c;
  --accent-ink: #1b1406;
  --math-bg: #f4f6f9;
  --stage: #0b121b;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }
html { min-height: 100%; max-width: 100%; overflow-x: hidden; overflow-y: auto; }
body {
  min-height: 100%; max-width: 100%; box-sizing: border-box; overflow-x: hidden; overflow-y: visible; margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px;
}
.course { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.course > .realm-bar { width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; justify-self: stretch; overflow-x: auto; }
.course-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.course-head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; text-wrap: balance; }
.count { font-family: var(--mono); font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-body {
  width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr);
  grid-template-areas: "stage lead" "stage tail"; grid-template-rows: auto minmax(0, 1fr); column-gap: 16px; row-gap: 0; align-items: stretch;
}
.stage { grid-area: stage; position: relative; aspect-ratio: 16 / 11; max-width: 100%; background: var(--stage); border-radius: 12px; overflow: hidden; align-self: start; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.story-lead, .story-tail { box-sizing: border-box; width: 100%; min-width: 0; background: var(--surface); border-inline: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.story-lead { grid-area: lead; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; padding: 18px 18px 0; }
.story-tail { grid-area: tail; border-bottom: 1px solid var(--line); border-radius: 0 0 12px 12px; padding: 12px 18px 14px; }
.chapter { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.story-lead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.text { max-width: 65ch; }
.text kbd { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.math { font-family: var(--mono); font-size: 14px; line-height: 1.75; background: var(--math-bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; overflow-wrap: anywhere; }
.bp { opacity: 0.15; transition: opacity 0.3s; }
.bp.on { opacity: 1; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls button { font: inherit; font-size: 15px; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.controls button:hover { border-color: var(--accent); }
.controls button:disabled { opacity: 0.4; cursor: default; }
.controls #board-next { margin-left: auto; background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); font-weight: 700; padding: 10px 26px; font-size: 17px; }
.controls #board-next:disabled { opacity: 0.55; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.visual-data { min-width: 0; max-width: 100%; box-sizing: border-box; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--math-bg); }
.visual-data summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 700; }
.visual-data p { margin: 7px 0; font-size: 14px; }
.visual-data .table-scroll { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
.visual-data table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.visual-data caption { text-align: left; color: var(--muted); padding: 4px 0 6px; }
.visual-data th, .visual-data td { border: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
.visual-data th:first-child, .visual-data td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; background: var(--math-bg); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.contents summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.contents ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; font-size: 14px; border-top: 1px solid var(--line); }
.contents .bl-chap { color: var(--accent); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 4px 2px; }
.contents .bl-step { display: flex; width: 100%; gap: 8px; padding: 3px 6px; border: 0; border-radius: 6px; cursor: pointer; background: transparent; color: inherit; font: inherit; text-align: left; }
.contents .bl-step span { min-width: 1.8em; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.contents .bl-step:hover { background: var(--math-bg); }
.contents .bl-step.on { background: var(--math-bg); font-weight: 700; }
.contents .bl-step:focus-visible { outline: 3px solid var(--accent); outline-offset: -1px; }
.progress { display: flex; gap: 4px; }
.progress .seg { position: relative; flex-basis: 0; min-width: 0; height: 36px; border: 0; border-radius: 6px; background: var(--line); cursor: pointer; overflow: hidden; padding: 0 8px; text-align: left; color: var(--ink); font: inherit; }
.progress .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-fill); opacity: 0.55; transition: width 0.3s; }
.progress .seg.on .fill { opacity: 0.9; }
.progress .name { position: relative; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.progress .seg.on .name { font-weight: 700; }
@media (max-width: 820px) {
  body { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .course-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "lead" "stage" "tail"; grid-template-rows: auto auto auto; gap: 12px; }
  .stage { aspect-ratio: 4 / 5; }
  .story-lead, .story-tail { border: 1px solid var(--line); border-radius: 12px; }
  .story-lead { padding: 15px 16px; }
  .story-tail { padding: 14px 16px; }
  .story-lead h2 { font-size: 23px; }
  .controls {
    position: fixed; z-index: 20; inset-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px));
    bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 16px)); box-sizing: border-box; margin-inline: auto;
    padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); background: color-mix(in srgb, var(--surface) 94%, transparent);
    box-shadow: 0 8px 26px rgba(0,0,0,0.24); backdrop-filter: blur(10px);
  }
  .controls button { padding: 7px 10px; font-size: 14px; }
  .controls #board-next { padding: 8px 14px; font-size: 15px; }
  .progress .name { display: none; }
  .progress .seg { height: 12px; padding: 0; }
}
@media (max-width: 600px) { .course[data-step="sweep"] .stage { aspect-ratio: 2 / 3; } }
@media (max-width: 420px) {
  .course[data-step="sweep"] .stage { aspect-ratio: 4 / 7; }
  .controls { gap: 5px; }
  .controls button { padding-inline: 8px; }
  .controls #board-next { padding-inline: 11px; }
}
fieldset.predict { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; background: var(--math-bg); }
fieldset.predict legend { padding: 0 5px; color: var(--accent); font-weight: 700; }
fieldset.predict label { display: flex; align-items: center; min-height: 44px; gap: 7px; cursor: pointer; }
fieldset.predict input { width: 18px; height: 18px; accent-color: var(--accent); }
fieldset.predict p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bp, .progress .fill { transition: none; } }
</style>
</head>
<body>
<main class="course" id="board">
  <header class="course-head">
    <div>
      <div class="eyebrow">Reading a BER table · the Red recordings</div>
      <h1 id="board-title">Five receivers on the Red recordings</h1>
    </div>
    <span class="count" id="board-count"></span>
  </header>
  <div class="course-body">
    <div class="stage"><canvas id="board-canvas" role="img" aria-label="Animated illustration for the current tutorial step" aria-describedby="board-visual-summary board-text board-math">The lesson text and chart description give the same information as this animated illustration.</canvas></div>
    <section class="story-lead" aria-labelledby="board-step" aria-live="polite">
      <div class="chapter" id="board-chapter"></div>
      <h2 id="board-step"></h2>
      <div class="text" id="board-text"></div>
    </section>
    <div class="story-tail">
      <div class="math" id="board-math"></div>
      <p class="sr-only" id="board-visual-summary"></p>
      <details class="visual-data"><summary id="board-visual-summary-label">Chart description</summary><div id="board-visual-details"></div></details>
      <div class="controls">
        <button type="button" id="board-prev">← Back</button>
        <button type="button" id="board-replay" title="Play this step’s animation again">↻ Replay</button>
        <button type="button" id="board-play" aria-pressed="false">⏵ Play</button>
        <button type="button" id="board-next">Next →</button>
      </div>
      <details class="contents"><summary>Contents</summary><ol id="board-list"></ol></details>
    </div>
  </div>
  <nav class="progress" id="progress" aria-label="Chapters"></nav>
</main>
<script>
// The step-by-step board of kings_land_descent.html.  It cuts one day's reckoning of a hero (or yours, after you feel
// the slope) into small steps.  Each step has a few plain words, its formula with that day's numbers, and an
// animation on a flat chart of the land: where the hero stands, how the height is made, the four taps, the slopes
// they give, and the hero's move.  game.js opens the board with the day's context; Board.register adds the steps of
// one part of the reckoning (this file holds the parts every hero shares, board_parts.js the others).
//
// A step is { id, chapter, title, text, math, layout, view, dur, draw }:
//   layout  'map' (the land seen from above), 'map+side' (the map and a panel beside it) or 'side' (a panel only);
//   view    the part of the land the map shows, [x1min, x1max, x2min, x2max]; the board glides from one view to the next;
//   dur     seconds the animation takes; text and math are HTML, and a part wrapped by at(p, html) shows from
//           progress p of the animation on;
//   draw(g, p) draws the step at progress p in [0, 1] with the kit g (g.mapR and g.sideR are the two panels).
var Board = (function () {
  'use strict';
  var TAU = 2 * Math.PI;
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  // the progress of a part of a step's animation that runs from a to b
  function seg(p, a, b) { return ease((p - a) / (b - a)); }
  function mix(a, b, t) { return a + (b - a) * t; }
  function lerp2(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function add(a, b, s) { s = s == null ? 1 : s; return [a[0] + s * b[0], a[1] + s * b[1]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function len(a) { return Math.hypot(a[0], a[1]); }
  function scale(a, s) { return [a[0] * s, a[1] * s]; }
  function backOut(t) { var s = 1.6; t = clamp(t, 0, 1) - 1; return t * t * ((s + 1) * t + s) + 1; }
  function num(v, d) {
    if (v == null || !isFinite(v)) return '—';
    var s = v.toFixed(d == null ? 3 : d);
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return s.replace('-', '−');
  }
  function pair(v, d) { return '(' + num(v[0], d) + ', ' + num(v[1], d) + ')'; }
  // a number ready to be multiplied: negative numbers in brackets
  function par(v, d) { var t = num(v, d); return v < 0 && t !== '0.000' ? '(' + t + ')' : t; }
  function at(p, html) { return '<span class="bp" data-at="' + p + '">' + html + '</span>'; }
  function frac(a, b) { return '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; }
  // a view around some points: their box, widened by a share of its size, at least `least` wide
  function around(pts, grow, least) {
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach(function (q) { if (!q) return; x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max((x1 - x0) * (1 + grow), (y1 - y0) * (1 + grow), least);
    return [cx - w / 2, cx + w / 2, cy - w / 2, cy + w / 2];
  }

  var C = { bg: '#0b121b', ink: '#f2f5f8', dim: 'rgba(242,245,248,0.6)', faint: 'rgba(242,245,248,0.22)', gold: '#ffd27a',
            orange: '#ffb071', blue: '#a9cdf6', green: '#b9f0a8', red: '#ff9a8a', violet: '#d9c2ff', box: 'rgba(8,12,18,0.82)' };
  var HERO = { pg: { col: '#ffb071', letter: 'P' }, lb: { col: '#a9cdf6', letter: 'C' }, tw: { col: '#e6e9ee', letter: 'W' }, you: { col: '#ffd27a', letter: 'Y' } };

  // ------------------------------------------------------------ the drawing kit
  // Drawings in world spots keep inside the map's panel when a side panel shares the canvas.
  function mapOnly(fn) { return function () { if (!this.sideR || !this.mapR) return fn.apply(this, arguments); var c = this.ctx, R = this.mapR; c.save(); c.beginPath(); c.rect(R[0], R[1], R[2], R[3]); c.clip(); try { return fn.apply(this, arguments); } finally { c.restore(); } }; }
  function Kit(canvas) { this.cv = canvas; this.ctx = canvas.getContext('2d'); this.W = 0; this.H = 0; this.grid = null; this.lines = {}; }
  Kit.prototype.fit = function () {
    var r = this.cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = Math.max(240, Math.round(r.width)), H = Math.max(180, Math.round(r.height));
    if (this.cv.width !== Math.round(W * dpr) || this.cv.height !== Math.round(H * dpr)) { this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr); }
    this.W = W; this.H = H; this.dpr = dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.sans = getComputedStyle(document.body).fontFamily || 'sans-serif';
    this.mono = (getComputedStyle(document.documentElement).getPropertyValue('--mono') || '').trim() || 'monospace';
  };
  Kit.prototype.clear = function () { var c = this.ctx; c.globalAlpha = 1; c.setLineDash([]); c.fillStyle = C.bg; c.fillRect(0, 0, this.W, this.H); };
  Kit.prototype.layout = function (kind) {
    var W = this.W, H = this.H, m = 8;
    this.mapR = this.sideR = null;
    if (kind === 'side') this.sideR = [m, m, W - 2 * m, H - 2 * m];
    else if (kind === 'map+side') {
      if (W >= H * 1.1) { var w = Math.round((W - 3 * m) * 0.54); this.mapR = [m, m, w, H - 2 * m]; this.sideR = [2 * m + w, m, W - 3 * m - w, H - 2 * m]; }
      else { var h = Math.round((H - 3 * m) * 0.55); this.mapR = [m, m, W - 2 * m, h]; this.sideR = [m, 2 * m + h, W - 2 * m, H - 3 * m - h]; }
    } else this.mapR = [m, m, W - 2 * m, H - 2 * m];
  };
  // The map: world spot q = (x1, x2) to canvas, x1 to the right and x2 up, one scale for both.
  Kit.prototype.view = function (v) {
    var R = this.mapR, vw = v[1] - v[0], vh = v[3] - v[2], s = Math.min(R[2] / vw, R[3] / vh);
    this.s = s; this.ox = R[0] + R[2] / 2 - (v[0] + v[1]) / 2 * s; this.oy = R[1] + R[3] / 2 + (v[2] + v[3]) / 2 * s;
    this.vis = [(R[0] - this.ox) / s, (R[0] + R[2] - this.ox) / s, (this.oy - R[1] - R[3]) / s, (this.oy - R[1]) / s];
  };
  Kit.prototype.P = function (q) { return [this.ox + q[0] * this.s, this.oy - q[1] * this.s]; };
  Kit.prototype.clip = function (R) { var c = this.ctx; c.save(); c.beginPath(); rrect(c, R[0], R[1], R[2], R[3], 8); c.clip(); };
  function rrect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function ramp(t) {
    var lo = [26, 58, 92], mid = [92, 112, 120], hi = [150, 98, 58], u = clamp(t, 0, 1);
    return u < 0.5 ? [mix(lo[0], mid[0], u * 2), mix(lo[1], mid[1], u * 2), mix(lo[2], mid[2], u * 2)] : [mix(mid[0], hi[0], u * 2 - 1), mix(mid[1], hi[1], u * 2 - 1), mix(mid[2], hi[2], u * 2 - 1)];
  }
  // The land as shading and rings of equal height.  fn is the height; o.lo, o.hi fix the shading's range (else the
  // range in view), o.rings the number of rings (spaced so that a bowl gets evenly spaced rings), o.id names fn.
  Kit.prototype.land = function (fn, o) {
    o = o || {};
    var R = this.mapR, v = this.vis, cell = o.cell || 4, nx = Math.max(40, Math.round(R[2] / cell)), ny = Math.max(30, Math.round(R[3] / cell));
    var key = (o.id || 'J') + '|' + v.map(function (a) { return a.toPrecision(7); }).join(',') + '|' + nx + 'x' + ny;
    // the last few grids are kept, so a page may draw two lands in one frame (one fading into the other) without
    // recomputing either; each grid keeps its own rings and level lines
    var g = this.grid && this.grid.key === key ? this.grid : (this.grids && this.grids[key]) || null;
    if (!g) {
      var vals = new Float64Array((nx + 1) * (ny + 1)), lo = Infinity, hi = -Infinity;
      for (var j = 0; j <= ny; j++) for (var i = 0; i <= nx; i++) {
        var z = fn([v[0] + (v[1] - v[0]) * i / nx, v[2] + (v[3] - v[2]) * j / ny]); vals[j * (nx + 1) + i] = z;
        if (isFinite(z)) { if (z < lo) lo = z; if (z > hi) hi = z; }
      }
      g = { key: key, vals: vals, nx: nx, ny: ny, lo: lo, hi: hi, img: null, imgKey: '', rings: null, ringKey: '', lines: {} };
      if (!this.grids) { this.grids = {}; this.gridOrder = []; }
      this.grids[key] = g; this.gridOrder.push(key); if (this.gridOrder.length > 4) delete this.grids[this.gridOrder.shift()];
    }
    this.grid = g; this.lines = g.lines;
    var lo = o.lo != null ? o.lo : g.lo, hi = o.hi != null ? o.hi : g.hi; if (!(hi > lo)) hi = lo + 1;
    var c = this.ctx;

  out.push({ id: 'coral', chapter: CH.rx, title: 'CORAL: parity modifies the search direction', layout: 'side', dur: 6.5,
    text: 'CORAL is the table’s project label for the source profile jcade_regularized_power; it is a name, not an expanded acronym. It estimates the channel response and variables representing the coded bits jointly. The implementation restricts the response matrix to a band and each bit variable to its permitted interval. ' +
      'Its objective function combines a term measuring mismatch to the received signal, a regularization term on the response, a pull toward binary values, and a penalty term formed from products computed over each parity check. It calls no BP or min-sum decoder. ' +
      'On a violated parity check, the production profile modifies the parity component of the search direction. Each trial is projected to the permitted interval. A backtracking line search accepts it only when the objective function decreases. The resulting direction is not the gradient of the objective function.',

    draw: function (g, p) {
      var R = g.sideR, narrow = R[2] < 560; g.panel(R, narrow ? 'CORAL: no BP decoder' : 'estimate channel and bit variables without BP');

    } });

  out.push({ id: 'cajode', chapter: CH.rx, title: 'CAJODE: local copies and scaled dual variables', layout: 'side', dur: 7,
    text: 'CAJODE, Code-Aided Joint OFDM Demodulation and Error Correction, estimates the channel response and variables representing the coded bits jointly. The alternating direction method of multipliers (ADMM) coordinates one constrained local copy of the bit variables for each parity check. Each edge between a parity check and one of its bit variables has a scaled dual variable. ' +
      'One update computes one weight for each received sample, obtains a bit update by majorization–minimization, and recomputes the weights. It then solves exactly for the sparse channel estimate, projects the local copies onto parity polytopes, and updates the scaled dual variables. ' +
      'After thresholding the shared bits, a candidate is accepted only if every parity check passes, the bits fixed by the configuration have the required values, and the cyclic redundancy check (CRC) passes. Acceptance is separate from convergence of the continuous variables. This table permits at most 50 updates.',
    math: 'weights → bits → recomputed weights → channel → parity-polytope projections → scaled dual variables' + at(0.8, ';  candidate: parity + fixed bits + CRC'),
    draw: function (g, p) {

    } });

  var coh = {}; D.receivers.forEach(function (r) { (coh[r.cohort] = coh[r.cohort] || []).push(r.id); });

  out.push({ id: 'cohorts', chapter: CH.rx, title: 'Two cohorts in one table', layout: 'side', dur: 5.5,
    text: 'The table joins two sets of runs and records the source cohort on every row. ' + list(replay.map(function (k) { return M.NAME[k]; })) + ' come from the authenticated four-receiver Red replay. ' +
      'That replay also contained an older jade_bp output, which this table excludes instead of mixing it into the modern JADE curve. ' + list(modern.map(function (k) { return M.NAME[k]; })) + ' come from the newer R3 BER campaign. ' +
      'The cohorts share the reported FFT length, code rate, frame count, pilot-ratio labels, SNR labels, and recording–hydrophone labels. Their provenance hashes do not establish identical received samples, payloads, or noise draws across cohorts.',

  out.push({ id: 'common', chapter: CH.read, title: 'Common coverage before comparison', layout: 'side', dur: 6,

      'Pooling adds their errors and bits before dividing. One resulting value is a pooled curve point. Common labels make coverage comparable, but they do not make the two cohorts a paired experiment or establish why curves differ.',

  out.push({ id: 'one-curve', chapter: CH.read, title: 'Reading one BER curve', layout: 'side', dur: 7,

      'For OFDM + FEC on ' + chanText(EXC.c) + ' at ' + pct(EXC.ratio) + ' pilots, the ' + ex0.snr + ' dB result has about ' + num(ex0.ber, 2) + ' of its bits wrong. ' +
      'The sampled curve falls steeply from ' + steepFrom + ' dB. From ' + exZero + ' dB onward, no error is observed among ' + group(M.bits(pi(EXC.ratio))) + ' scored bits at each receiver result. Each hollow marker is plotted at 0.5 / N only for visibility.',
    math: 'x: SNR in dB;  y: information BER, logarithmic' + at(0.7, ';  no error seen from ' + exZero + ' dB'),

      g.labelPx(pl.X(z.snr) - 10, pl.Y(z.plot) + 26, 'no error seen: hollow, plotted at 0.5 / N', C.ink, { size: 12, align: 'right', p: seg(p, 0.85, 1) });
    } });

  // ------------------------------------------------------------ 4. what the table shows (pooled over the common channels)
  var i75 = pi(7.5);
  function curvesAt(i, p, o) { o = o || {}; return ORDER.map(function (k, n) { return { id: k, pts: CURVES[k][i], p: o.all ? p : seg(p, 0.1 + 0.13 * n, 0.3 + 0.13 * n) }; }); }
  var coralFloor = Math.min.apply(null, LOWEST.coral);
  out.push({ id: 'p75-predict', chapter: CH.shows, title: 'Predict the five-way comparison', layout: 'side', dur: 3.5,

      P.legend(g, R[0] + 16, R[1] + R[3] - lh + 10, ORDER, { p: seg(p, 0, 0.5), size: narrow ? 11 : 12, wrap: R[0] + R[2] - 170 });
      g.labelPx(R[0] + R[2] / 2, R[1] + R[3] * 0.5, 'Which curve will remain highest?', C.gold, { size: narrow ? 12 : 14, align: 'center', p: seg(p, 0.25, 0.55) });
    } });
  out.push({ id: 'p75', chapter: CH.shows, title: 'At 7.5% pilots', layout: 'side', dur: 7.5,
    text: 'These are the five pooled curves at ' + pct(7.5) + ' pilots. JADE first reaches a pooled BER of 10⁻³ or less at ' + dB(FIRST.jade[i75]) + ', and CAJODE at ' + dB(FIRST.cajode[i75]) + '. ' +

      P.legend(g, R[0] + 16, R[1] + R[3] - lh + 10, ORDER, { p: seg(p, 0, 0.6), size: narrow ? 11 : 12, wrap: R[0] + R[2] - 170 });
      g.labelPx(R[0] + R[2] - 16, R[1] + R[3] - (narrow ? 14 : lh - 10), 'dashed: 10⁻³, a reading aid', C.gold, { plain: true, size: 11.5, align: 'right', p: seg(p, 0.75, 0.9) });
    } });

  var twoFive = Math.min.apply(null, ORDER.map(function (k) { return LOWEST[k][0]; }));
  var firstPilotOnly = PIL.map(function (pl, i) { return FIRST['ofdm+fec'][i] != null && FIRST['pfft+fec'][i] != null; }).indexOf(true);
  out.push({ id: 'sweep', chapter: CH.shows, title: 'Supporting view: all five pilot sweeps', layout: 'side', dur: 9,
    text: 'These panels retain the full curves behind the threshold grid. With ' + pct(LO.ratio) + ' pilots no pooled curve falls below ' + sci(twoFive, 1) + ', even at the sampled 30 dB endpoint. ' +
      'OFDM + FEC and Partial FFT + FEC first reach 10⁻³ from ' + pct(PIL[firstPilotOnly].ratio) + ' pilots. The sampled results do not obey a pointwise rule that more pilots always lowers every curve. ' +

      var R = g.sideR, narrow = R[2] < 560; g.panel(R);
      var cols = narrow ? 2 : 3, rows = Math.ceil(PIL.length / cols), lh = narrow ? 60 : 30, w = (R[2] - 12) / cols, h = (R[3] - lh - 8) / rows;
      PIL.forEach(function (pl, i) {

        P.berPlot(g, [x, y, w - 6, h - 6], { compact: true, title: pct(pl.ratio) + ' pilots', decades: [-7, 0], ref: 1e-3, refP: q, curves: curvesAt(i, q, { all: true }) });

    '.realm-more,.realm-map-more{border-top:1px dashed var(--line,var(--rule,#d3dbe4));padding-top:7px}.realm-more summary,.realm-map-more summary{cursor:pointer;color:var(--accent,#8f5a00);font-weight:700;font-size:13px}.realm-more[open]{display:grid;gap:8px}',
    '.realm-fork p{margin:0;font-size:14px}',
    '.realm-fork button{font:inherit;font-size:13.5px;border:1px solid var(--accent,#8f5a00);border-radius:8px;background:transparent;color:var(--accent,#8f5a00);padding:3px 10px;cursor:pointer;margin-left:6px}',
    '.realm-predict{display:grid;gap:7px;border-top:1px solid rgba(255,210,122,.25);padding-top:8px}.realm-predict>b{color:var(--accent,#8f5a00)}.realm-predict-actions{display:flex;gap:6px;flex-wrap:wrap}.realm-predict-actions button{margin:0;min-height:34px}.realm-predict-feedback{min-height:1.4em;color:var(--accent,#8f5a00);font-weight:700}',
    '.realm-on-road #progress{display:none}',

    '.board .realm-fork-head,.board .realm-fork button{color:#ffd27a;border-color:rgba(255,210,122,0.6)}',
    '.board .realm-road{background:rgba(255,255,255,0.04);color:#f2f5f8;border-color:rgba(255,255,255,0.2)}',
    '.board .realm-road-hook,.board .realm-road-time,.board .realm-transfer span{color:rgba(242,245,248,0.74)}.board .realm-transfer b{color:#f2f5f8}.board .realm-role,.board .realm-road-status{color:#ffd27a!important}.board .realm-fork p{color:#f2f5f8}',
    '#board-text a{color:var(--accent,#8f5a00);text-underline-offset:2px}',
    '.board .board-text a{color:#ffd27a}',
    '.realm-landroads{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}',
    '.realm-landroads .realm-fork-head{grid-column:1/-1;color:var(--orange,#c45100)}',
    '.realm-landroads .realm-road{background:var(--sheet,#f4f7fb)}.realm-landroads>.realm-more{grid-column:1/-1}',
    '@media(max-width:680px){.realm-bar .realm-lead{display:none}.realm-bar:after{content:"more →";position:sticky;right:0;flex:none;padding:3px 5px;color:var(--muted,var(--ink-2,#546273));background:var(--bg,#edf1f5);font-size:11px}.realm-actions{display:grid;grid-template-columns:1fr}.realm-actions a{justify-content:center;min-height:40px}.realm-transfer{gap:6px}.realm-predict-actions{display:grid}.realm-predict-actions button{margin:0;min-height:42px}}'
  ].join('\n');

  function here() { var m = document.querySelector ? document.querySelector('meta[name="kings-land-page"]') : null; return (m && m.getAttribute('content')) || window.REALM_PAGE || null; }
  function init() {
    page = here(); if (!page || !PLACES[page] || !document.createElement) return;
    var h = parse(window.kingsLandHash != null ? window.kingsLandHash : window.location && window.location.hash); shot = 'step' in h || 'shot' in h || 'map' in h;
    try { var st = document.createElement('style'); st.textContent = CSS; (document.head || document.body).appendChild(st); } catch (e) { /* no styles in a test */ }
    barEl = document.createElement('nav'); barEl.className = 'realm-bar'; barEl.setAttribute('aria-label', 'King’s Land Descent pages; scroll horizontally for more');
    var host = page === 'game' ? document.querySelector('.wrap') : document.querySelector('main.course');
    if (host && host.insertBefore) host.insertBefore(barEl, host.firstChild);
    forkEl = document.createElement('aside'); forkEl.className = 'realm-fork'; forkEl.hidden = true; forkEl.setAttribute('aria-label', 'Roads to other pages');
    var math = $('board-math'); if (math && math.parentNode && math.parentNode.insertBefore) math.parentNode.insertBefore(forkEl, math.nextSibling);
    if (page === 'game') landRoads();
    stamp('seen');
    B.onAnyStep(watch);
    if (document.addEventListener) document.addEventListener('click', onClick);
    var r = h.via ? road(h.via) : null;
    if (r && r.to === page) { arrive(r, h.from, { trail: h.trail, full: h.full === '1' }); if (h.shot != null) B.debug({ step: +h.shot || 0, p: h.p != null ? +h.p : 1 }); }
    else if (h.map != null) { openMap(); if (h.p != null) B.debug({ step: 0, p: +h.p }); }
    else {
      var rr = h.ret && road(h.ret); if (rr && rr.to === page && validSource(rr, h.from)) ticket = { road: rr, from: h.from, playing: false, parent: unpackTrail(h.trail, rr.from) };
      if (h.at && page !== 'game' && !shot) { var k = idx(h.at); if (k >= 0) B.go(k); }
      if (h.at && page === 'game') {
        try { if (window.kingsLand && window.kingsLand.api) window.kingsLand.api.setLand(h.at); if (window.kingsLandHash && window.history) history.replaceState(null, '', window.kingsLandHash); } catch (e) { /* the game may not be ready in a test */ }
      }
    }
    renderBar(); var d = B.debug({}); if (d.open && !(r && r.to === page)) renderFork(d.id, d.road, d.i);
  }
  try { init(); } catch (e) { (window.kingsLandErrors = window.kingsLandErrors || []).push('realm: ' + (e && e.stack || e)); }

  // For tests: the data, the scenes, and the arrival and map without an address.
  return { PLACES: PLACES, ORDER: ORDER, ROADS: ROADS, SCENES: SCENES, MAP: MAP, terrain: terrain, roadSteps: roadSteps, mapStep: mapStep, road: road, ROAD_KINDS: ROAD_KINDS,
           PRIMARY_ROADS: PRIMARY_ROADS, SECONDARY_ROADS: SECONDARY_ROADS, MAP_ROADS: MAP_ROADS, offer: offer, predictionFor: predictionFor,
           arrive: function (id, from, o) { return arrive(road(id), from, o); }, openMap: openMap, page: function () { return page; }, ticket: function () { return ticket; }, glyph: glyph, keyDraw: keyDraw, realmMap: realmMap };
})();

<script>
// Phone presentation and motion accessibility live in the shell so the lesson's numerical/model source stays
// independent.
(function () {
  'use strict';
  var B = window.Board, course = window.course;
  var count = document.getElementById('board-count'), board = document.getElementById('board'), bar = document.getElementById('progress');
  var canvas = document.getElementById('board-canvas'), visualSummary = document.getElementById('board-visual-summary');
  var visualDetails = document.getElementById('board-visual-details'), visualLabel = document.getElementById('board-visual-summary-label');
  if (!B || !course || !count || !board) return;

  // At phone width the visible chapter names collapse into small bars.  aria-label preserves a complete, stable
  // name for each button, and aria-current tells a screen reader which chapter contains the present step.
  function labelChapters() {
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.seg'), function (b, k) {
      var name = b.getAttribute('title') || ('chapter ' + (k + 1));
      b.setAttribute('aria-label', 'Chapter ' + (k + 1) + ': ' + name);
      if (b.classList.contains('on')) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      var fill = b.querySelector('.fill'); if (fill) fill.setAttribute('aria-hidden', 'true');
    });
  }
  function labelContents() {
    var list = document.getElementById('board-list'); if (!list) return;
    Array.prototype.forEach.call(list.querySelectorAll('.bl-step'), function (button) {
      var n = +button.getAttribute('data-i'), label = (button.textContent || '').replace(/^\s*\d+\s*/, '');
      button.setAttribute('aria-label', 'Step ' + (n + 1) + ': ' + label);
    });
  }
  labelChapters();
  labelContents();

  var VISUAL = {
    question: 'A five-row comparison introduces the five receiver names; colour and marker shape identify the same receiver throughout the lesson.',
    grid: 'A grid expands one recording and hydrophone into pilot-ratio and signal-to-noise-ratio test conditions, then into one result per receiver.',
    pilots: 'A payload bar shrinks as the known pilot portion grows.',
    pooled: 'Error counts and payload-bit counts from several recording-hydrophone cases are added before their ratio is taken.',
    zero: 'A hollow marker with a downward arrow means no errors were observed; its plotted height is only a visibility convention.',
    routes: 'A comparison table places the five complete receiver routes side by side and names where channel estimation, decoding, feedback and code constraints occur.',
    'pilot-only': 'Two receiver pipelines end at the decoder and have no return arrow from decoder to channel estimation.',
    jade: 'The JADE pipeline has a return arrow carrying decoder extrinsic log-likelihood ratios into another receiver pass.',
    coral: 'The CORAL diagram shows channel coefficients and one relaxed scalar per coded bit updated in its joint loop.',
    cajode: 'The CAJODE diagram adds local bit-variable copies for each parity check and scaled dual variables that track disagreement.',
    cohorts: 'Two outlined groups show that the five receiver results come from two separate experimental cohorts.',
    missing: 'A receiver-by-channel coverage matrix uses hatching for missing results and text beneath it to give the missing reason.',
    common: 'The recording-hydrophone tiles with all five receivers are highlighted; hatched tiles are excluded from the five-way pooled comparison.',
    'one-curve-predict': 'An empty logarithmic chart asks where the first measured BER point will lie. No measured result is shown yet.',
    'one-curve': 'One logarithmic bit-error-rate curve falls as signal-to-noise ratio increases. Hollow ending markers mean no error was observed.',
    'p75-predict': 'An empty five-receiver chart asks which curve will remain highest at the sampled high-SNR end. No measured result is shown yet.',
    p75: 'Five pooled bit-error-rate curves share one logarithmic plot at 7.5 percent pilots. Colour and marker shape both identify each receiver.',
    sweep: 'Five small plots repeat the same five-receiver comparison at 2.5, 5, 7.5, 12 and 15 percent pilots. All panels use the same axes and the same 10 to the minus 3 reading line.',
    thresholds: 'A five-by-five matrix reports the first sampled signal-to-noise ratio whose pooled bit error rate is at most 10 to the minus 3.',
    zeros: 'Two rows of receiver markers show where runs of sampled points with no observed errors begin at 12 and 15 percent pilots.',
    channels: 'A five-by-twelve matrix compares receivers across recording-hydrophone cases at 5 percent pilots and 20 decibels. Cell colour and the printed BER decade encode magnitude; hatching means missing.',
    supports: 'Two columns separate descriptive statements supported by this table from claims the table cannot establish.',
    snapshot: 'A provenance card lists the table snapshot, row counts, settings, common cases and file hash.',
    synthesis: 'Five compact receiver-route cards connect each mechanism to the bounded observation this table can support.'
  };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function berText(q) { if (!q) return 'missing'; if (q.zero) return '0 observed errors'; return q.ber.toExponential(2).replace('e-', ' × 10^−').replace('e+', ' × 10^'); }
  function tableHtml(caption, heads, rows) {
    return '<div class="table-scroll" tabindex="0" role="region" aria-label="Scrollable numerical data"><table><caption>' + esc(caption) + '</caption><thead><tr><th scope="col">Receiver</th>' +
      heads.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><th scope="row">' + esc(r[0]) + '</th>' + r.slice(1).map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function thresholdsTable() {
    var M = window.Ber, D = window.BerData; if (!M || !D) return '';
    var heads = D.pilots.map(function (p) { return p.ratio + '% pilots'; });
    var rows = M.IDS.map(function (id) { return [M.NAME[id]].concat(D.pilots.map(function (p, pi) { var s = M.firstAtMost(M.curve(id, pi), 1e-3); return s == null ? 'not reached' : s + ' dB'; })); });
    return tableHtml('First sampled SNR with pooled BER at most 10^−3, over the common recording-hydrophone cases.', heads, rows);
  }
  function pooledTable(ratio) {
    var M = window.Ber, D = window.BerData; if (!M || !D) return '';
    var pi = M.pilotIndex(ratio), heads = D.snrs.map(function (s) { return s + ' dB'; });
    var rows = M.IDS.map(function (id) { return [M.NAME[id]].concat(D.snrs.map(function (s, si) { return berText(M.pooled(id, pi, si)); })); });
    return tableHtml('Pooled information BER at ' + ratio + '% pilots.', heads, rows);
  }
  function channelsTable() {
    var M = window.Ber; if (!M) return '';
    var pi = M.pilotIndex(5), si = M.snrIndex(20), heads = M.CHANNELS.map(function (ch) { return ch.key; });
    var rows = M.IDS.map(function (id) { return [M.NAME[id]].concat(M.CHANNELS.map(function (ch) { return berText(M.point(id, ch, pi, si)); })); });
    return tableHtml('Information BER for every recording-hydrophone case at 5% pilots and 20 dB.', heads, rows);
  }
  function updateAccessibleView() {
    var state = B.debug(), id = state.id || '', step = course.steps[state.i], title = document.getElementById('board-step').textContent || state.title || 'Current tutorial step';
    var description = step && step.a11y || VISUAL[id] || 'The illustration supports the adjacent lesson text; no conclusion depends on animation alone.';
    board.setAttribute('data-step', id); if (canvas) canvas.setAttribute('aria-label', title + '. Animated chart or diagram.');
    if (visualSummary) visualSummary.textContent = description;
    if (visualDetails) {
      var table = id === 'channels' ? channelsTable() : id === 'thresholds' || id === 'sweep' ? thresholdsTable() : id === 'p75' ? pooledTable(7.5) : '';
      visualDetails.innerHTML = '<p>' + esc(description) + '</p>' + table;
      if (visualLabel) visualLabel.textContent = table ? 'Chart description and numerical data' : 'Chart description';
    }
  }

  // The ordinary player animates every newly opened step even while autoplay is off.  A reduced-motion reader sees
  // its final explanatory state immediately.  Replay and Play remain explicit opt-ins to motion.
  var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduceMotion = !!(motionQuery && motionQuery.matches), explicitMotion = false, replayTimer = 0;
  board.setAttribute('data-motion', reduceMotion ? 'reduced' : 'full');
  function clearReplay() { if (replayTimer) window.clearTimeout(replayTimer); replayTimer = 0; }
  function freezeAtEnd() { if (reduceMotion && !explicitMotion) B.debug({ p: 1 }); }
  function stopExplicitMotion() { clearReplay(); explicitMotion = false; window.setTimeout(freezeAtEnd, 0); }
  function restartForPlay() {
    if (!reduceMotion) return;
    clearReplay(); explicitMotion = true;
    var state = B.debug(); B.debug({ live: true }); B.go(state.i);
  }
  function replayOnce() {
    if (!reduceMotion) return;
    clearReplay(); explicitMotion = true; B.debug({ live: true });
    var state = B.debug(), step = course.steps[state.i], ms = 1000 * ((step && step.dur) || 3) + 250;
    replayTimer = window.setTimeout(function () { replayTimer = 0; explicitMotion = false; freezeAtEnd(); }, ms);
  }
  var replay = document.getElementById('board-replay'), play = document.getElementById('board-play');
  if (replay) replay.addEventListener('click', replayOnce, true);
  if (play) play.addEventListener('click', function () {
    if (!reduceMotion) return;
    if (play.getAttribute('aria-pressed') === 'true') stopExplicitMotion(); else restartForPlay();
  }, true);
  ['board-prev', 'board-next', 'board-list', 'progress'].forEach(function (id) {
    var el = document.getElementById(id); if (el) el.addEventListener('click', function () { if (reduceMotion) stopExplicitMotion(); }, true);
  });
  document.addEventListener('keydown', function (e) {
    if (!reduceMotion || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName)) return;
    if (e.key === ' ') { if (play && play.getAttribute('aria-pressed') === 'true') stopExplicitMotion(); else restartForPlay(); }
    else if (e.key === 'r' || e.key === 'R') replayOnce();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Enter') stopExplicitMotion();
  }, true);
  if (play && window.MutationObserver) new MutationObserver(function () {
    if (reduceMotion && play.getAttribute('aria-pressed') !== 'true' && explicitMotion && !replayTimer) stopExplicitMotion();
  }).observe(play, { attributes: true, attributeFilter: ['aria-pressed'] });
  if (motionQuery) {
    var motionChanged = function (e) { reduceMotion = e.matches; board.setAttribute('data-motion', reduceMotion ? 'reduced' : 'full'); if (reduceMotion) stopExplicitMotion(); else { clearReplay(); explicitMotion = false; B.debug({ live: true }); } };
    if (motionQuery.addEventListener) motionQuery.addEventListener('change', motionChanged); else if (motionQuery.addListener) motionQuery.addListener(motionChanged);
  }

  // Every step change updates accessibility state and, on phones, returns the new canvas to the top of the view.
  B.onAnyStep(function () {
    labelChapters();
    labelContents();
    updateAccessibleView();
    if (reduceMotion && !explicitMotion) freezeAtEnd();
  });
  updateAccessibleView();
  freezeAtEnd();
  if (window.MutationObserver) new MutationObserver(function () {
    if (!window.matchMedia || !window.matchMedia('(max-width: 820px)').matches) return;
    requestAnimationFrame(function () { requestAnimationFrame(function () { board.scrollIntoView({ block: 'start', behavior: 'auto' }); }); });
  }).observe(count, { childList: true, characterData: true, subtree: true });
})();
