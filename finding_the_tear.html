<style>

@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bg: #0c1218; --surface: #131b24; --ink: #e6ebf0; --muted: #9aa8b6; --line: #253242; --accent: #ffd27a; --accent-fill: #ffd27a; --accent-ink: #1b1406; --math-bg: #0f161e; color-scheme: dark; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px;
}
.course { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.course-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

<script>
// The step-by-step board of kings_land_descent.html.  It cuts one day's reckoning of a hero (or yours, after you feel
// the slope) into small steps.  Each step has a few plain words, its formula with that day's numbers, and an
// animation on a flat chart of the land: where the hero stands, how the height is made, the four taps, the slopes
// they give, and the hero's move.  game.js opens the board with the day's context; Board.register adds the steps of
// one part of the reckoning (this file holds the parts every hero shares, board_parts.js the others).

//   dur     seconds the animation takes; text and math are HTML, and a part wrapped by at(p, html) shows from

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function len(a) { return Math.hypot(a[0], a[1]); }

    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max((x1 - x0) * (1 + grow), (y1 - y0) * (1 + grow), least);

  var HERO = { pg: { col: '#ffb071', letter: 'P' }, lb: { col: '#a9cdf6', letter: 'C' }, tw: { col: '#e6e9ee', letter: 'W' }, you: { col: '#ffd27a', letter: 'Y' } };

<script>
// The torn-net case study of the tutorial "Finding the tear" (finding_the_tear.html): an ROV photographs a patch

// the broken-or-intact state of every twine.  Soft terms: the knot detections (robust, pseudo-Huber), the twine
// evidence read from the image along each predicted twine, a prior against breaks.  Geometric constraints: each
// mesh is a parallelogram, the rope's column lies on the rope, and the tagged knot sits on the tag.  The positions
// use an ADMM-style split into shared knots and one projected copy per geometric rule.  The binary twine states do

    text: 'This synthetic net assumes each mesh’s four knots form an exact parallelogram: a + c = b + d. This keeps neighbouring rows and columns locally regular, but it does not fix twine lengths or prove that a real loaded cage behaves exactly this way. It is a modeling assumption chosen because projection onto the allowed affine set is easy.',

    draw: function (g, pr) { base(g, { alpha: 0.58 }); P.lattice(g, lat, { pos: truth, col: 'rgba(230,233,238,0.5)', p: 1, knotCol: C.ink, r: 3 }); P.mesh(g, meshPts(truth, mShow), { col: C.blue, fill: 'rgba(169,205,246,0.18)', p: seg(pr, 0, 0.4), lw: 2.5, label: 'mesh ' + meshName(mShow) }); ['a', 'b', 'c', 'd'].forEach(function (name, k) { g.label(truth[mk.knots[k]], name, C.blue, { dx: k === 0 || k === 3 ? -10 : 10, dy: k < 2 ? 14 : -12, align: k === 0 || k === 3 ? 'right' : 'left', p: seg(pr, 0.2, 0.5), size: 12 }); }); P.lines(g, g.sideR, [{ text: 'used here: exact local parallelograms', col: C.blue }, { text: 'not enforced: fixed twine length', col: C.dim }, { text: 'not established: exact field behavior', col: C.orange }, { text: 'benefit: a simple affine projection', col: JADE }], pr, 'Model boundary'); } });

  out.push({ id: 'impostors', chapter: CH.geometry, title: 'A repeated grid creates registration aliases', layout: 'map', view: SV, dur: 6.4,

  // ------------------------------------------------------------ 4. the optimization problem

  var kShow = lat.K(4, 3), r1 = R[1], wk = r1.walks[kShow], aimsK = r1.aims[kShow], detK = r1.assocBefore[kShow] >= 0 ? d.det.knots[r1.assocBefore[kShow]].q : null;
  var ksView = around([start.pos[kShow], wk.q, wk.quad].concat(detK ? [detK] : []).concat(aimsK), 2.5, 1.2);
  out.push({ id: 'position', chapter: CH.consensus, title: 'First solve the frozen quadratic part', layout: 'map+side', view: ksView, dur: 6,
    text: 'At the start of a position sweep, associations, robust weights, twine states, copies, and scaled duals are frozen. For one knot, the detection term and the quadratic pulls toward all targets v are then quadratic. Their exact minimizer is a weighted mean. For knot (4, 3), ' + aimsK.length + ' geometric rules supply targets and the frozen detection weight is ' + num(r1.weightsBefore[kShow], 2) + '.',

    draw: function (g, pr) { base(g); P.lattice(g, lat, { pos: start.pos, col: 'rgba(230,233,238,0.28)', p: 1, knots: false }); var q0 = start.pos[kShow]; g.dot(q0, 5, C.ink, 1); g.label(q0, 'old p', C.ink, { dx: 10, dy: -12, size: 12 }); if (detK) { P.detections(g, [{ q: detK, knot: kShow }], { p: 1 }); g.label(detK, 'detection', C.gold, { dx: 10, dy: 16, p: seg(pr, 0.1, 0.35), size: 12 }); } aimsK.forEach(function (a) { g.dot(a, 4, C.violet, seg(pr, 0.2, 0.4)); }); g.arrow(q0, wk.quad, JADE, 2.5, seg(pr, 0.4, 0.7)); g.dot(wk.quad, 5, JADE, seg(pr, 0.62, 0.82)); g.label(wk.quad, 'weighted quadratic minimizer', JADE, { dx: -12, dy: 18, align: 'right', p: seg(pr, 0.7, 0.92), size: 12 }); P.lines(g, g.sideR, [{ text: 'freeze association, weight, b, z, and u', col: C.dim }, { text: 'detection pulls with weight w/σ²', col: C.gold }, { text: aimsK.length + ' targets pull with weight ρ', col: C.violet }, { text: 'weighted mean minimizes these terms', col: JADE }], pr, 'Quadratic part'); } });

  out.push({ id: 'probes', chapter: CH.consensus, title: 'Then probe the sampled image and test each stride', layout: 'map+side', view: ksView, dur: 6.2,

    draw: function (g, pr) { base(g, { alpha: 0.65 }); P.lattice(g, lat, { pos: R[bitRound].pos, word: R[bitRound].word, col: 'rgba(230,233,238,0.65)', broken: C.red, p: seg(pr, 0, 0.55), knots: false }); P.lines(g, g.sideR, [{ text: 'new p gives new sample locations', col: C.gold }, { text: 'recompute every model-based LLR', col: C.ink }, { text: 'if ℓ + λ < 0: set b = 1 torn', col: C.red }, { text: 'otherwise: set b = 0 intact', col: JADE }, { text: R[bitRound].flagged.length + ' called torn after round ' + bitRound, col: C.ink }], pr, 'Binary state update'); } });

  var lawIdx = -1; S.laws.forEach(function (law, i) { if (law.kind === 'mesh' && law.mesh === mShow) lawIdx = i; });
  var kP = Math.min(2, K_END), rP = R[kP], uPrev = R[kP - 1].u[lawIdx], before = S.laws[lawIdx].at.map(function (i, j) { return add(rP.pos[i], uPrev[j]); }), afterZ = rP.z[lawIdx];
  var gapP = Math.max.apply(null, before.map(function (q, j) { return N.norm(sub(q, afterZ[j])); }));
  out.push({ id: 'project', chapter: CH.consensus, title: 'Each rule projects its local copies', layout: 'map+side', view: around(before.concat(afterZ), 1.2, 1.6), dur: 5.8,

    draw: function (g, pr) { base(g, { alpha: 0.5 }); P.mesh(g, before, { col: C.orange, dash: [5, 4], p: seg(pr, 0, 0.35), label: 'p + old u' }); P.mesh(g, afterZ, { col: C.blue, fill: 'rgba(169,205,246,0.18)', p: seg(pr, 0.4, 0.72), lw: 2.5, label: 'projected z' }); before.forEach(function (q, j) { g.arrow(q, afterZ[j], C.blue, 2, seg(pr, 0.3, 0.62)); }); P.lines(g, g.sideR, [{ text: 'input: p + old u', col: C.orange }, { text: 'output: nearest allowed copy z', col: C.blue }, { text: 'largest corner correction: ' + num(gapP, 3), col: C.ink }, { text: 'z obeys this mesh rule exactly', col: JADE }, { text: 'p and z may still disagree', col: C.dim }], pr, 'One local projection'); } });

  var dualSlot = 0, dualK = S.laws[lawIdx].at[dualSlot], dualP = rP.pos[dualK], dualZ = rP.z[lawIdx][dualSlot], dualOld = uPrev[dualSlot], dualNew = rP.u[lawIdx][dualSlot];
  out.push({ id: 'dual', chapter: CH.consensus, title: 'The scaled dual remembers signed disagreement', layout: 'map+side', view: around([dualP, dualZ, add(dualP, dualOld)], 4, 0.5), dur: 5.8,
    text: 'After projection, the shared knot and local copy usually differ. The scaled dual update adds that signed disagreement to its previous value. Persistent disagreement therefore changes the next target v = z − u instead of being forgotten. The scaled dual is bookkeeping for consensus—not a physical force, a knot, or another measurement.',
    math: 'uᵣₙ ← uᵣₙ + pₙ − zᵣₙ; next target vᵣₙ = zᵣₙ − uᵣₙ',
    draw: function (g, pr) { base(g, { alpha: 0.35 }); g.dot(dualP, 6, C.gold, 1); P.copyDot(g, dualZ, dualP, 1, 'z'); g.arrow(dualZ, dualP, C.orange, 2.5, seg(pr, 0.15, 0.48)); g.label(lerp2(dualZ, dualP, 0.5), 'p − z', C.orange, { dx: 8, dy: -12, p: seg(pr, 0.3, 0.55), size: 12 }); P.lines(g, g.sideR, [{ text: 'old u = ' + pair(dualOld, 3), col: C.dim, mono: true }, { text: 'p − z = ' + pair(sub(dualP, dualZ), 3), col: C.orange, mono: true }, { text: 'new u = ' + pair(dualNew, 3), col: C.gold, mono: true }, { text: 'u persists into the next round', col: JADE }, { text: 'then v = z − u changes', col: C.ink }], pr, 'Consensus memory'); } });

  out.push({ id: 'round', chapter: CH.consensus, title: 'One complete round—in the net’s actual order', layout: 'side', dur: 6.2,
    text: 'The net solver has its own update order. It freezes detection associations and robust weights; sweeps through knot positions; recomputes image LLRs; thresholds the hard twine states; projects local position copies; updates scaled dual variables; and finally runs the targeted verification check. This is not CAJODE’s exact update order.',
    math: 'associate + weight → positions p → LLRs → hard states b → copies z → scaled duals u → targeted verification',
    draw: function (g, pr) { P.lines(g, g.sideR, [{ text: '1 associate knots and freeze robust weights', col: C.gold }, { text: '2 sweep through shared positions p', col: JADE }, { text: '3 re-read image LLRs', col: C.ink }, { text: '4 threshold hard states b', col: C.red }, { text: '5 project local position copies z', col: C.blue }, { text: '6 update scaled duals u', col: C.orange }, { text: '7 run targeted synthetic verification', col: C.violet }], pr, 'The net solver—not CAJODE'); } });

  // ------------------------------------------------------------ 6. run, stopping, verification, and result
  var correctRound = R.findIndex(function (r) { return r.flagged.join(',') === d.brokenIds.join(','); });
  out.push({ id: 'run', chapter: CH.run, title: 'The false tears clear as registration improves', layout: 'map+side', view: VIEW, dur: 9,
    text: 'The rigid initialization calls ' + start.flagged.length + ' twines torn. As the lattice registers to the net, LLRs are read in better locations and false tear decisions clear. The exact candidate set first equals the hidden three at round ' + correctRound + '. The operational gate finally stops at round ' + K_STOP + '. A count alone is not a correctness test, so the exact identities are checked on the result page.',
    math: 'twines called torn by round: ' + R.map(function (r) { return r.flagged.length; }).join(', '),
    draw: function (g, pr) { var kk = seg(pr, 0, 0.9) * K_STOP, pos = posAt(kk), rec = R[Math.min(Math.floor(kk), K_END)]; base(g, { alpha: 0.68 }); P.lattice(g, lat, { pos: pos, word: rec.word, col: 'rgba(230,233,238,0.82)', broken: C.red, p: 1, knotCol: C.ink, r: 3 }); g.labelPx(g.mapR[0] + 12, g.mapR[1] + 30, 'round ' + Math.floor(kk) + ': ' + rec.flagged.length + ' twines called torn', C.gold, { size: 13 }); var ymax = Math.max.apply(null, R.map(function (r) { return r.flagged.length; })) + 2, pl = g.plot(g.sideR, [0, K_STOP], [0, ymax], { title: 'hard tear decisions by round' }); pl.frame('round', 'twines called torn'); pl.seg(0, d.brokenIds.length, K_STOP, d.brokenIds.length, C.red, 1.4, 1, [5, 4]); pl.curve(function (t) { var i = Math.floor(t), f = t - i; return R[Math.min(i, K_END)].flagged.length * (1 - f) + R[Math.min(i + 1, K_END)].flagged.length * f; }, JADE, 2, clamp(kk / K_STOP, 0, 1)); if (kk >= K_STOP) pl.point(K_STOP, fin.flagged.length, C.gold, 'operational stop', 1, 'left'); } });

  out.push({ id: 'stopping', chapter: CH.run, title: 'Separate geometry, consensus, motion, and acceptance', layout: 'side', dur: 6.4,
    text: 'Four questions must not be collapsed into “converged.” At the final round, the largest correction needed to put any local tuple directly on its geometry set is ' + num(fin.geometry.projectionCorrection, 4) + ' mesh. The ADMM-style primal residual norm is ' + num(fin.consensus.primal, 4) + '. The shared positions moved by as much as ' + num(fin.moved, 4) + ' mesh in the last round. The run stops because targeted verification passed while the geometry correction was below ' + num(p.tol, 2) + '—not because textbook ADMM residual thresholds proved convergence.',
    math: 'geometry correction ≠ primal residual ≠ dual residual ≠ iterate motion ≠ verification result',
    draw: function (g, pr) { P.lines(g, g.sideR, [{ text: 'geometry correction: ' + num(fin.geometry.projectionCorrection, 4), col: C.blue, mono: true }, { text: 'mesh closure ‖a+c−b−d‖: ' + num(fin.geometry.meshClosure, 4), col: C.blue, mono: true }, { text: 'primal residual ‖Ap−z‖₂: ' + num(fin.consensus.primal, 4), col: C.violet, mono: true }, { text: 'dual residual ‖s‖₂/ρ: ' + num(fin.consensus.dualOverRho, 4), col: C.orange, mono: true }, { text: 'largest last-round p move: ' + num(fin.moved, 4), col: C.gold, mono: true }, { text: 'stop reason: ' + S.stopReason, col: JADE }, { text: 'no ADMM convergence claim', col: C.dim }], pr, 'Distinct diagnostics'); } });

  var kReject = Math.min(5, K_END), cuR = R[kReject].closeup, cuF = fin.closeup;
  out.push({ id: 'verification', chapter: CH.run, title: 'The close-up is targeted verification—not a CRC', layout: 'map+side', view: VIEW, dur: 6.4,
    text: 'The simulator generates a quieter second image and, using hidden true geometry, models an operator centering a close-up on twines around the currently flagged meshes. At round ' + kReject + ', ' + cuR.agreed + ' of ' + cuR.checked + ' inspected twines agree, so the candidate is rejected. At round ' + K_STOP + ', all ' + cuF.checked + ' inspected twines agree. But only ' + cuF.checked + ' of ' + cuF.total + ' twines are inspected: this confirms the proposed repair area and cannot rule out a missed tear elsewhere. It is not a cyclic redundancy check.',
    math: 'targeted follow-up: confirm twines around predicted-open meshes; limitation: unflagged regions are not covered',
    draw: function (g, pr) { var late = pr > 0.5, rec = late ? fin : R[kReject], cu = late ? cuF : cuR; base(g, { closeup: true, alpha: 0.78 }); P.lattice(g, lat, { pos: rec.pos, word: rec.word, col: 'rgba(230,233,238,0.48)', broken: C.red, p: 1, knots: false }); rec.open.forEach(function (mi) { P.mesh(g, meshPts(rec.pos, mi), { col: late ? JADE : C.orange, fill: late ? 'rgba(127,214,180,0.18)' : 'rgba(255,176,113,0.18)', p: 1 }); }); P.lines(g, g.sideR, [{ text: 'round ' + (late ? K_STOP : kReject) + ': ' + cu.agreed + '/' + cu.checked + ' inspected agree', col: late ? JADE : C.orange }, { text: 'coverage: ' + cu.checked + '/' + cu.total + ' twines', col: C.ink }, { text: 'hidden geometry simulates centering', col: C.violet }, { text: 'confirms the proposed repair region', col: JADE }, { text: 'cannot exclude a missed remote tear', col: C.orange }, { text: 'not a CRC or convergence proof', col: C.dim }], pr, 'Targeted synthetic follow-up'); } });

  out.push({ id: 'result', chapter: CH.run, title: 'Field-style report and simulator-only evaluation', layout: 'map+side', view: VIEW, dur: 6.4,
    text: 'The field-style output is three torn-twine candidates, ' + fin.flagged.map(twineName).join(', ') + ', opening meshes ' + fin.open.map(meshName).join(', ') + ' relative to tag 17. Separately, the simulator can compare against hidden truth: all three binary identities are correct and the maximum knot-position error is ' + num(fin.regError, 3) + ' mesh. That second sentence is evaluation evidence available only in this synthetic case.',
    math: 'report: candidate twines and meshes; synthetic evaluation: exact word match, max position error ' + num(fin.regError, 3) + ' mesh',
    draw: function (g, pr) { base(g, { alpha: 0.68 }); P.lattice(g, lat, { pos: fin.pos, word: fin.word, col: 'rgba(230,233,238,0.68)', broken: C.red, p: 1, knots: false }); fin.open.forEach(function (mi, k) { P.mesh(g, meshPts(fin.pos, mi), { col: C.red, fill: 'rgba(255,99,99,0.22)', p: seg(pr, 0.08 + 0.1 * k, 0.3 + 0.1 * k), label: meshName(mi) }); }); P.tag(g, d.det.tag, 1, 'tag 17'); P.lines(g, g.sideR, [{ text: 'FIELD-STYLE OUTPUT', col: C.gold }, { text: fin.flagged.length + ' candidate torn twines', col: C.red }, { text: 'open: ' + fin.open.map(meshName).join(', '), col: C.red, mono: true }, { text: 'SIMULATOR-ONLY EVALUATION', col: C.violet }, { text: 'candidate word equals hidden truth ✓', col: JADE }, { text: 'max position error: ' + num(fin.regError, 3), col: JADE, mono: true }], pr, 'Output versus evaluation'); } });

  // ------------------------------------------------------------ 7. the precise bridge to CAJODE
  out.push({ id: 'bridge', chapter: CH.bridge, title: 'The part that genuinely transfers to CAJODE', layout: 'side', dur: 6.2,
    text: 'Both problems split a shared variable into local projected copies. Each local copy has a persistent scaled dual variable, the shared update is pulled toward z − u, projection enforces a simple local set, and u accumulates disagreement. In CAJODE the shared variable is a relaxed bit and each local set is a parity polytope. In this net toy the shared variable is a knot position and each local set is an affine geometry set.',
    math: 'shared skeleton: shared variable → local projected copies z → scaled duals u → targets z−u',
    draw: function (g, pr) { var RR = P.split(g.sideR, 0.5); P.lines(g, RR[0], [{ text: 'CAJODE: relaxed bits copied per check', col: C.gold }, { text: 'net: knot positions copied per rule', col: C.blue }, { text: 'both: project each local copy', col: JADE }], pr, 'What is shared'); P.lines(g, RR[1], [{ text: 'both: u stores shared − copy', col: C.orange }, { text: 'both: the next target is z − u', col: JADE }, { text: 'the local sets themselves differ', col: C.dim }], pr, 'Consensus bookkeeping'); } });

  out.push({ id: 'differences', chapter: CH.bridge, title: 'The parts that do not transfer unchanged', layout: 'side', dur: 6.2,
    text: 'The analogy stops at the splitting pattern. CAJODE uses relaxed bit updates, bit/check replicas, parity-polytope projections, a conditional channel solve, and syndrome followed by cyclic redundancy check acceptance. The net uses hard independent twine thresholds, position/geometry copies, affine projections, a sampled-image position sweep, and targeted synthetic follow-up. Their update orders and guarantees are not the same.',
    math: 'same splitting pattern; different variables, feasible sets, block updates, order, and acceptance evidence',
    draw: function (g, pr) { var RR = P.split(g.sideR, 0.5); P.lines(g, RR[0], [{ text: 'CAJODE state: relaxed bit', col: C.gold }, { text: 'net state: hard twine threshold', col: C.red }, { text: 'copies: bit/check → knot/rule', col: C.blue }], pr, 'Discrete and copied variables'); P.lines(g, RR[1], [{ text: 'sets: parity → affine geometry', col: C.blue }, { text: 'continuous: channel → image sweep', col: JADE }, { text: 'gate: syndrome + CRC → targeted look', col: C.orange }], pr, 'Updates and acceptance'); } });

  out.push({ id: 'learned', chapter: CH.bridge, title: 'What to carry forward', layout: 'map+side', view: VIEW, dur: 6,
    text: 'The useful lesson is a sequence, not a metaphor. Define the continuous and discrete unknowns. State what the observations assume. Show why the two blocks are coupled. Introduce shared variables, local copies, and scaled duals before writing their updates. Keep geometric consistency, numerical convergence, operational verification, and hidden-truth evaluation separate. That disciplined structure is what this net example shares with CAJODE.',
    math: 'model → evidence → coupling → copies → updates → diagnostics → verification → honest claim boundary',
    draw: function (g, pr) { base(g, { alpha: 0.62 }); P.lattice(g, lat, { pos: fin.pos, word: fin.word, col: 'rgba(230,233,238,0.65)', broken: C.red, p: seg(pr, 0, 0.55), knots: false }); P.lines(g, g.sideR, [{ text: '1 define p and b', col: C.gold }, { text: '2 derive the model-based evidence', col: C.ink }, { text: '3 explain the coupling', col: C.violet }, { text: '4 define p, z, u, and z−u', col: C.blue }, { text: '5 separate every stopping claim', col: C.orange }, { text: '6 transfer only the valid pattern', col: JADE }], pr, 'A reusable way to reason'); } });

  // ------------------------------------------------------------ player, chapter bar, keyboard, and deep links
  var chapters = [];
  out.forEach(function (s, i) { if (!chapters.length || chapters[chapters.length - 1].name !== s.chapter) chapters.push({ name: s.chapter, start: i, n: 0 }); chapters[chapters.length - 1].n++; });
  var bar = document.getElementById('progress');
  if (bar) {
    bar.innerHTML = chapters.map(function (ch, k) { return '<button type="button" class="seg" data-k="' + k + '" style="flex-grow:' + ch.n + '" title="' + ch.name + '"><span class="fill"></span><span class="name">' + ch.name + '</span></button>'; }).join('');
    bar.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-k]') : null; if (b) B.go(chapters[+b.getAttribute('data-k')].start); });
  }
  B.onStep(function (i) {
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('[data-k]'), function (b, k) { var ch = chapters[k], f = clamp((i - ch.start + 1) / ch.n, 0, 1); b.querySelector('.fill').style.width = Math.round(f * 100) + '%'; b.classList.toggle('on', i >= ch.start && i < ch.start + ch.n); });
  });
  document.addEventListener('keydown', function (e) { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName) && (e.key === ' ' || e.key === 'Enter')) return; B.key(e); });
  B.openSteps(out, { embedded: true });
  window.course = { steps: out, chapters: chapters, net: d };
  var hash = (window.location && window.location.hash) || '', ms = /step=([^&]+)/.exec(hash), mp = /p=([0-9.]+)/.exec(hash);
  if (ms) { var st = decodeURIComponent(ms[1]); B.debug({ step: /^\d+$/.test(st) ? +st : st, p: mp ? +mp[1] : 1 }); }
})();

<script>
// The roads of King’s Land Descent.  Six pages share one player (board.js): the game, the tale “Three heroes
// downhill”, the CAJODE receiver tutorial and three case studies.  This file joins them.  A road starts on a step where
// the reader has just met an idea that another page uses, and it is offered in a card under that step’s formula.
// Taking it opens the other page with a short interlude played by the same player: the map of the King’s land with the
// road walked, a scene that sets up the new place, and a key of what changes name.  A bar at the top of every page lists
// the six places, marks the ones visited, opens the map, and keeps a ticket back to where the reader left.
//
// Pages say who they are with <meta name="kings-land-page" content="tutorial">.  The address carries the state:
//   #via=ROAD&from=STEP   arrive by a road: play its interlude, then continue at its landing step;
//   #at=STEP              open at that step (written on every step, so Back and reload return to it);
//   #via=ROAD&shot=K&p=P  freeze the road’s step K at progress P (for screenshots); #step=… stays the courses’ own hook.
// Plain JavaScript (ES5), like the rest of the player.
var Realm = (function () {
  'use strict';
  var B = window.Board; if (!B) return null;
  var H = B.H, C = H.C, seg = H.seg, ease = H.ease, clamp = H.clamp, mix = H.mix, lerp2 = H.lerp2, add = H.add, sub = H.sub, len = H.len, scale = H.scale, backOut = H.backOut, num = H.num;
  var TAU = 2 * Math.PI, JADE = '#7fd6b4', PALE = '#e6e9ee', SANDY = 'rgba(244,226,190,0.72)';

  // ------------------------------------------------------------ the places
  var PLACES = {
    game:     { file: 'index.html', name: 'King’s Land Descent', bar: 'The game', sub: 'walk the land yourself', q: [1.7, 3.95], icon: 'flag' },
    tutorial: { file: 'tutorial.html', name: 'Three heroes downhill', bar: 'Three heroes downhill', sub: 'gradient descent, L-BFGS, ADMM', q: [3.6, 6.15], icon: 'castle' },
    soldiers: { file: 'bp_and_cajode.html', name: 'Counting soldiers', bar: 'BP and CAJODE', sub: 'belief propagation and CAJODE', q: [1.25, 7.0], icon: 'soldiers' },
    keep:     { file: 'jade_keep_tutorial.html', name: 'CAJODE', bar: 'CAJODE receiver', sub: 'joint OFDM demodulation and decoding', q: [9.55, 6.3], icon: 'keep' },
    coach:    { file: 'the_coach_and_the_physio.html', name: 'The Coach and the Physio', bar: 'Coach and Physio', sub: 'a training plan', q: [4.75, 2.15], icon: 'track' },
    dive:     { file: 'localization_is_decoding.html', name: 'The inspection dive', bar: 'Inspection dive', sub: 'localization at a monopile', q: [7.55, 3.15], icon: 'pile' },
    net:      { file: 'finding_the_tear.html', name: 'Finding the tear', bar: 'Finding the tear', sub: 'a fish-farm net', q: [10.45, 1.95], icon: 'pen' },
    red:      { file: 'five_receivers_on_red.html', name: 'The Red recordings', bar: 'Red BER table', sub: 'five receivers, measured bit errors', q: [11.15, 4.3], icon: 'buoy' }
  };
  var ORDER = ['game', 'tutorial', 'soldiers', 'keep', 'coach', 'dive', 'net', 'red'];

  // ------------------------------------------------------------ the map of the King’s land, world box [0, 12] × [0, 8]
  var MAP = [0, 12, 0, 8], LO = -0.6, HI = 1.9;
  function bump(x, y, cx, cy, sx, sy, h) { var dx = (x - cx) / sx, dy = (y - cy) / sy; return h * Math.exp(-(dx * dx + dy * dy) / 2); }
  // the mainland in the west with the castle hill, the Keep’s island in the north-east, a headland sheltering the pens
  function terrain(q) {
    var x = q[0], y = q[1];
    return -1 + bump(x, y, 2.6, 4.4, 2.5, 3.0, 1.75) + bump(x, y, 3.7, 6.2, 0.9, 0.8, 0.6) + bump(x, y, 1.25, 7.0, 0.8, 0.6, 0.55) + bump(x, y, 4.9, 2.0, 1.4, 1.2, 0.5)
      + bump(x, y, 9.6, 6.45, 1.2, 0.95, 1.35) + bump(x, y, 11.7, 1.5, 0.8, 1.5, 1.1) + 0.12 * Math.sin(1.7 * x + 0.6) * Math.cos(1.3 * y);
  }
  // a road between two places: a gentle quadratic curve, the same both ways (sea lanes are dashed)
  function roadPts(a, b) {
    var flip = ORDER.indexOf(a) > ORDER.indexOf(b), a0 = flip ? b : a, b0 = flip ? a : b, A = PLACES[a0].q, Bq = PLACES[b0].q;
    var d = sub(Bq, A), L = len(d), n = [-d[1] / L, d[0] / L], k = (ORDER.indexOf(a0) + ORDER.indexOf(b0)) % 2 ? 1 : -1, ctrl = add(lerp2(A, Bq, 0.5), scale(n, 0.15 * L * k)), pts = [];
    for (var j = 0; j <= 48; j++) { var t = j / 48, u = 1 - t; pts.push([u * u * A[0] + 2 * u * t * ctrl[0] + t * t * Bq[0], u * u * A[1] + 2 * u * t * ctrl[1] + t * t * Bq[1]]); }
    return flip ? pts.reverse() : pts;
  }
  function atSea(a, b) { return ['keep', 'dive', 'net', 'red'].indexOf(a) >= 0 || ['keep', 'dive', 'net', 'red'].indexOf(b) >= 0; }
  function along(pts, f) {
    var L = 0, segL = [], j; for (j = 1; j < pts.length; j++) { segL.push(len(sub(pts[j], pts[j - 1]))); L += segL[j - 1]; }
    var goal = L * clamp(f, 0, 1); for (j = 1; j < pts.length; j++) { if (goal <= segL[j - 1]) return lerp2(pts[j - 1], pts[j], segL[j - 1] ? goal / segL[j - 1] : 1); goal -= segL[j - 1]; }
    return pts[pts.length - 1].slice();
  }

  // ------------------------------------------------------------ the places’ icons, drawn in canvas pixels
  function disc(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = fill; c.fill(); }
  // a soldier of the soldier slides at (x, y), the middle of its body, s about half its height
  function trooper(c, x, y, s, body) {
    c.fillStyle = 'rgba(8,12,18,0.9)'; c.beginPath(); c.moveTo(x - 0.46 * s, y + 0.58 * s); c.lineTo(x - 0.46 * s, y - 0.42 * s); c.arc(x, y - 0.42 * s, 0.46 * s, Math.PI, TAU); c.lineTo(x + 0.46 * s, y + 0.58 * s); c.closePath(); c.fill();
    c.fillStyle = body || '#cfd8e2'; c.beginPath(); c.moveTo(x - 0.38 * s, y + 0.52 * s); c.lineTo(x - 0.38 * s, y - 0.36 * s); c.arc(x, y - 0.36 * s, 0.38 * s, Math.PI, TAU); c.lineTo(x + 0.38 * s, y + 0.52 * s); c.closePath(); c.fill();
    disc(c, x, y - 0.8 * s, 0.3 * s, '#e8c9a8'); c.fillStyle = '#3d6fa8'; c.beginPath(); c.arc(x, y - 0.88 * s, 0.31 * s, Math.PI, TAU); c.closePath(); c.fill(); c.fillRect(x - 0.4 * s, y - 0.9 * s, 0.8 * s, 0.09 * s);
  }
  function junctionBox(c, x, y, w, label, font) {
    c.fillStyle = '#1a2330'; c.strokeStyle = '#ffd27a'; c.lineWidth = 1.8; c.beginPath(); c.rect(x - w / 2, y - w / 2, w, w); c.fill(); c.stroke();
    if (label) { c.fillStyle = '#ffd27a'; c.font = '700 ' + Math.round(0.5 * w) + 'px ' + (font || 'sans-serif'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x, y + 0.5); }
  }
  function icon(c, kind, x, y, s, t) {
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (kind === 'castle') {
      c.fillStyle = '#efe3c8'; c.strokeStyle = '#3b2f1e'; c.lineWidth = 1.2;
      c.beginPath(); c.rect(x - 0.62 * s, y - 0.2 * s, 1.24 * s, 0.78 * s); c.fill(); c.stroke();
      [-0.66, 0.36].forEach(function (tx) { c.beginPath(); c.rect(x + tx * s, y - 0.72 * s, 0.3 * s, 1.3 * s); c.fill(); c.stroke();
        c.beginPath(); c.rect(x + tx * s - 0.03 * s, y - 0.86 * s, 0.1 * s, 0.14 * s); c.rect(x + tx * s + 0.23 * s, y - 0.86 * s, 0.1 * s, 0.14 * s); c.fill(); c.stroke(); });
      c.fillStyle = '#3b2f1e'; c.beginPath(); c.moveTo(x - 0.18 * s, y + 0.58 * s); c.lineTo(x - 0.18 * s, y + 0.3 * s); c.arc(x, y + 0.3 * s, 0.18 * s, Math.PI, 0); c.lineTo(x + 0.18 * s, y + 0.58 * s); c.closePath(); c.fill();
      c.strokeStyle = '#f2f5f8'; c.beginPath(); c.moveTo(x - 0.51 * s, y - 0.86 * s); c.lineTo(x - 0.51 * s, y - 1.28 * s); c.stroke();
      c.fillStyle = C.gold; c.beginPath(); c.moveTo(x - 0.51 * s, y - 1.28 * s); c.lineTo(x - 0.16 * s, y - 1.15 * s); c.lineTo(x - 0.51 * s, y - 1.02 * s); c.closePath(); c.fill();
    } else if (kind === 'flag') {
      c.strokeStyle = 'rgba(214,224,233,0.55)'; c.lineWidth = 2;

  }).observe(count, { childList: true, characterData: true, subtree: true });
})();
